---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: memos
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      memos:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init-db:
              image:
                repository: ghcr.io/home-operations/postgres-init
                tag: 18
                pullPolicy: IfNotPresent
              env:
                INIT_POSTGRES_DBNAME: memos
                INIT_POSTGRES_HOST: postgres-lb.storage.svc.cluster.local
                INIT_POSTGRES_SUPER_PASS: "${POSTGRES_SUPER_PASS}"
                INIT_POSTGRES_USER:
                  valueFrom:
                    secretKeyRef:
                      name: &secret cluster-memos-secrets
                      key: POSTGRES_USER
                INIT_POSTGRES_PASS:
                  valueFrom:
                    secretKeyRef:
                      name: *secret
                      key: POSTGRES_PASSWORD
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 568
            runAsGroup: 568
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: { type: RuntimeDefault }
        containers:
          app:
            image:
              repository: ghcr.io/usememos/memos
              tag: 0.30.0@sha256:71a5b4738d1bed96e92112004054f0888e92791b64eb78afd79077c96e6f9327
            env:
              MEMOS_MODE: prod
              MEMOS_PORT: &port 5230
              MEMOS_DRIVER: postgres
              MEMOS_INSTANCE_URL: https://memos.${SECRET_DOMAIN}
            envFrom:
              - secretRef:
                  name: cluster-memos-secrets
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 25m
                memory: 105Mi
              limits:
                memory: 500Mi
    service:
      app:
        controller: memos
        ports:
          http:
            port: *port

    route:
      app:
        hostnames:
          - "memos.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-external
            namespace: networking
        rules:
          - matches:
              - path:
                  type: Exact
                  value: /
            filters: &redirect
              - type: RequestRedirect
                requestRedirect:
                  path:
                    type: ReplaceFullPath
                    replaceFullPath: /auth
                  statusCode: 302
          - matches:
              - path:
                  type: Exact
                  value: /explore
              - path:
                  type: PathPrefix
                  value: /explore/
            filters: *redirect
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - identifier: app
                port: http
    persistence:
      config:
        existingClaim: memos-jericho
        advancedMounts:
          memos:
            app:
              - subPath: memos
                path: /var/opt/memos
