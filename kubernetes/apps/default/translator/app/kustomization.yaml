---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./helmrelease.yaml
  - ./secret.sops.yaml
configMapGenerator:
  - name: translator-bootstrap
    files:
      - bootstrap.py=./resources/bootstrap.py
      - retention.sh=./resources/retention.sh
generatorOptions:
  disableNameSuffixHash: true
