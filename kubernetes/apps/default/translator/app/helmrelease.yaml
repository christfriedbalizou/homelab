---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: translator
spec:
  interval: 30m
  timeout: 10m
  chartRef:
    kind: OCIRepository
    name: app-template
  dependsOn:
    - name: cloudnative-pg
      namespace: storage
  install:
    remediation:
      retries: 3
  values:
    controllers:
      translator:
        replicas: 1
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          automountServiceAccountToken: false
          terminationGracePeriodSeconds: 90
          nodeSelector:
            kubernetes.io/arch: amd64
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: In
                        values: [k8s-6, k8s-7]
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
        initContainers:
          migrate:
            image: &image
              repository: ghcr.io/christfriedbalizou/translator
              tag: 0.3.0@sha256:98d911ad65a0662a008cb5bd7ee86b8a6c779991bba48e665f6f3c3e8ab8cbfc
            command: [/bin/sh, -ec]
            args:
              - >-
                cp --remove-destination /release/source.tar.gz /source/source.tar.gz &&
                python /deployment/bootstrap.py --verify-only &&
                python -m translator.operations migrate &&
                python /deployment/bootstrap.py
            env: &env
              TZ: ${TIMEZONE}
              PRODUCTION: "true"
              OIDC_ISSUER: https://auth.${SECRET_DOMAIN}
              OIDC_CLIENT_ID: translator
              OIDC_CLIENT_SECRET_FILE: /run/secrets/oidc-client-secret
              OIDC_REDIRECT_URI: https://translator.${SECRET_DOMAIN}/api/v1/auth/callback
              SESSION_IDLE_TIMEOUT_SECONDS: "3600"
              SESSION_ABSOLUTE_TIMEOUT_SECONDS: "43200"
              SESSION_COOKIE_SECURE: "true"
              HTTP_SECURITY__ALLOWED_HOSTS: '["translator.${SECRET_DOMAIN}"]'
              # Only Envoy can reach the API; use its pod subnet for forwarded IPs.
              HTTP_SECURITY__TRUSTED_PROXY_IPS: '["10.42.0.0/16"]'
              INGESTION__MASTER_KEY_FILE: /run/secrets/document-master-key
              INGESTION__STORAGE_BACKEND: s3
              INGESTION__S3_ENDPOINT_URL: http://minio.storage.svc.cluster.local:9000
              INGESTION__S3_CREDENTIALS_FILE: /run/secrets/s3-credentials
              INGESTION__LOCAL_STORAGE_PATH: /data/documents
              INGESTION__MAX_UPLOAD_BYTES: "52428800"
              INGESTION__MAX_FILES_PER_BATCH: "10"
              INGESTION__MAX_ACTIVE_JOBS_PER_USER: "10"
              INGESTION__UPLOAD_ATTEMPTS_PER_WINDOW: "20"
              INGESTION__UPLOAD_RATE_WINDOW_SECONDS: "300"
              INGESTION__UPLOAD_TIMEOUT_SECONDS: "300"
              INGESTION__PDF_TIMEOUT_SECONDS: "60"
              INGESTION__PDF_MEMORY_BYTES: "1073741824"
              INGESTION__MAX_PDF_PAGES: "200"
              INGESTION__RETENTION_DAYS: "90"
              TRANSLATION__MASTER_KEY_FILE: /run/secrets/provider-master-key
              TRANSLATION__ALLOWED_PROVIDER_BASE_URLS: '["http://litellm.ai.svc.cluster.local:4000/v1","https://litellm.${SECRET_DOMAIN}/v1"]'
              TRANSLATION__ASSETS_DIRECTORY: /release/assets
              TRANSLATION__ASSETS_MANIFEST: /release/assets/manifest.json
              TRANSLATION__OCR__ENABLED: "true"
              TRANSLATION__OCR__ASSETS_DIRECTORY: /release/ocr
              TRANSLATION__OCR__DEVICE: cpu
              TRANSLATION__OCR__CPU_THREADS: "2"
              TRANSLATION__ENGINE_MEMORY_BYTES: "8589934592"
              TRANSLATION__ENGINE_TIMEOUT_SECONDS: "1800"
              TRANSLATION_WORKER_CONCURRENCY: "1"
              TRANSLATION_PROVIDER_CONCURRENCY: "1"
              TRANSLATION_JOB_TIMEOUT_SECONDS: "1800"
              TRANSLATION_MAX_ATTEMPTS: "3"
              CURRENCY__AUTOMATIC_ENABLED: "false"
              SOURCE_DISTRIBUTION__ARCHIVE: /source/source.tar.gz
              SOURCE_DISTRIBUTION__REVISION: a060883c6055465018e4aafe4d42eeed286cb5aa
              SOURCE_DISTRIBUTION__SHA256: 85c18e29b9637367a9d02a3be0c8830a1cfc5962ff64961241af5c4733fff76c
            envFrom: &envFrom
              - secretRef:
                  name: translator-secrets
            securityContext: &security
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: "1"
                memory: 1Gi
        containers:
          app:
            image: *image
            args: [api]
            env: *env
            envFrom: *envFrom
            securityContext: *security
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                cpu: "2"
                memory: 2Gi
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet: &health
                    path: /health
                    port: 8000
                    httpHeaders:
                      - name: Host
                        value: translator.${SECRET_DOMAIN}
                  failureThreshold: 30
                  periodSeconds: 10
                  timeoutSeconds: 5
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet: *health
                  periodSeconds: 30
                  timeoutSeconds: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    <<: *health
                    path: /ready
                  periodSeconds: 10
                  timeoutSeconds: 5
          worker:
            image: *image
            args: [worker]
            env: *env
            envFrom: *envFrom
            securityContext: *security
            resources:
              requests:
                cpu: 500m
                memory: 2Gi
              limits:
                cpu: "2"
                memory: 10Gi
    service:
      app:
        controller: translator
        ports:
          http:
            port: 8000
    route:
      app:
        hostnames:
          - translator.${SECRET_DOMAIN}
        parentRefs:
          - name: envoy-external
            namespace: networking
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: http
            timeouts:
              request: 0s
              backendRequest: 0s
    persistence:
      release:
        type: nfs
        server: ${NFS_SERVER_APPS}
        path: /volume1/apps/default/translator/releases/0.3.0
        globalMounts:
          - path: /release
            readOnly: true
      source-cache:
        # Reproducible source only; authoritative archive stays on Jericho.
        type: emptyDir
        sizeLimit: 2Gi
        advancedMounts:
          translator:
            migrate:
              - path: /source
            app:
              - path: /source
                readOnly: true
            worker:
              - path: /source
                readOnly: true
      keys:
        type: secret
        name: translator-keys
        defaultMode: 0440
        globalMounts:
          - path: /run/secrets
            readOnly: true
      deployment:
        type: configMap
        name: translator-bootstrap
        globalMounts:
          - path: /deployment
            readOnly: true
      tmp:
        type: emptyDir
        medium: Memory
        sizeLimit: 256Mi
        globalMounts:
          - path: /tmp
      api-shm:
        type: emptyDir
        medium: Memory
        sizeLimit: 1Gi
        advancedMounts:
          translator:
            app:
              - path: /dev/shm
      worker-shm:
        type: emptyDir
        medium: Memory
        sizeLimit: 6Gi
        advancedMounts:
          translator:
            worker:
              - path: /dev/shm
