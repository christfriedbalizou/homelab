---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: translator
spec:
  interval: 30m
  timeout: 10m
  chartRef:
    kind: OCIRepository
    name: app-template
  dependsOn:
    - name: cloudnative-pg
      namespace: storage
  install:
    remediation:
      retries: 3
  values:
    controllers:
      translator:
        replicas: 1
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          automountServiceAccountToken: false
          terminationGracePeriodSeconds: 90
          nodeSelector:
            kubernetes.io/arch: amd64
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: In
                        values: [k8s-6, k8s-7]
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
        containers:
          app:
            image: &image
              repository: ghcr.io/christfriedbalizou/translator
              tag: 0.11.2@sha256:d2e0805b20511cde45fabf1b2a8de835d1e1098432b39bd7c19f68b12a4d336b
            args: [api]
            env: &env
              TZ: ${TIMEZONE}
              TRANSLATOR_GPG_PRIVATE_KEY_FILE: /run/secrets/translator-private-key
              TRANSLATOR_GPG_PASSPHRASE_FILE: /run/secrets/translator-passphrase
              PRODUCTION: "true"
              OIDC_ISSUER: https://auth.${SECRET_DOMAIN}
              OIDC_CLIENT_ID: translator
              OIDC_CLIENT_SECRET_FILE: /run/secrets/oidc-client-secret
              OIDC_REDIRECT_URI: https://translator.${SECRET_DOMAIN}/api/v1/auth/callback
              SESSION_IDLE_TIMEOUT_SECONDS: "3600"
              SESSION_ABSOLUTE_TIMEOUT_SECONDS: "43200"
              SESSION_COOKIE_SECURE: "true"
              HTTP_SECURITY__ALLOWED_HOSTS: '["translator.${SECRET_DOMAIN}"]'
              # Only Envoy can reach the API; use its pod subnet for forwarded IPs.
              HTTP_SECURITY__TRUSTED_PROXY_IPS: '["10.42.0.0/16"]'
              GLOSSARY__MAX_ENTRIES: "2000"
              GLOSSARY__MAX_CONTENT_BYTES: "1048576"
              INGESTION__MAX_GLOSSARY_SNAPSHOT_BYTES: "1048576"
              INGESTION__MASTER_KEY_FILE: /run/secrets/document-master-key
              INGESTION__STORAGE_BACKEND: s3
              INGESTION__S3_ENDPOINT_URL: http://minio.storage.svc.cluster.local:9000
              INGESTION__S3_CREDENTIALS_FILE: /run/secrets/s3-credentials
              INGESTION__MAX_UPLOAD_BYTES: "52428800"
              INGESTION__MAX_FILES_PER_BATCH: "10"
              INGESTION__MAX_ACTIVE_JOBS_PER_USER: "10"
              INGESTION__UPLOAD_ATTEMPTS_PER_WINDOW: "20"
              INGESTION__UPLOAD_RATE_WINDOW_SECONDS: "300"
              INGESTION__UPLOAD_TIMEOUT_SECONDS: "300"
              INGESTION__PDF_TIMEOUT_SECONDS: "60"
              INGESTION__PDF_MEMORY_BYTES: "1073741824"
              INGESTION__MAX_PDF_PAGES: "200"
              INGESTION__RETENTION_DAYS: "90"
              TRANSLATION__MASTER_KEY_FILE: /run/secrets/provider-master-key
              TRANSLATION__ALLOWED_PROVIDER_BASE_URLS: '["http://litellm.ai.svc.cluster.local:4000/v1"]'
              # Keep the running deployment local-only while the encrypted
              # generated Secret is regenerated from bootstrap/vars/config.yaml.
              TRANSLATION__PROVIDERS: >-
                [{"id":"6ffb478e-2ec6-418a-bce8-2ec7f406d73b","api_key_file":"/run/secrets/litellm-api-key","configuration":{"base_url":"http://litellm.ai.svc.cluster.local:4000/v1","concurrency":1,"kind":"local","model":"translategemma-4b-q4-local","overall_timeout_seconds":300,"read_timeout_seconds":180,"user_selectable":false}},
                {"id":"81770d82-3f07-57c8-9f46-75cdb4716c7f","api_key_file":"/run/secrets/litellm-api-key","configuration":{"base_url":"http://litellm.ai.svc.cluster.local:4000/v1","concurrency":1,"kind":"local","model":"qwen3-1.7b-q8-local","overall_timeout_seconds":900,"read_timeout_seconds":600,"user_selectable":true,"disable_reasoning":true}},
                {"id":"0165878e-54e7-5d03-9ca2-e5b33d2d4231","api_key_file":"/run/secrets/litellm-api-key","configuration":{"base_url":"http://litellm.ai.svc.cluster.local:4000/v1","concurrency":1,"kind":"local","model":"gemma3-1b-it-q4-local","overall_timeout_seconds":900,"read_timeout_seconds":600,"user_selectable":true,"disable_reasoning":true}},
                {"id":"daf4ff4f-255f-5dd4-b1a9-d619be84e3ee","api_key_file":"/run/secrets/litellm-api-key","configuration":{"base_url":"http://litellm.ai.svc.cluster.local:4000/v1","concurrency":1,"kind":"local","model":"deepseek-r1-distill-qwen-1.5b-q4-local","overall_timeout_seconds":900,"read_timeout_seconds":600,"user_selectable":true,"disable_reasoning":true}}]
              TRANSLATION__ASSETS_DIRECTORY: /release/assets
              TRANSLATION__ASSETS_MANIFEST: /release/assets/manifest.json
              TRANSLATION__OCR__ENABLED: "true"
              TRANSLATION__OCR__ASSETS_DIRECTORY: /release/ocr
              TRANSLATION__OCR__DEVICE: cpu
              TRANSLATION__OCR__CPU_THREADS: "2"
              TRANSLATION__ENGINE_MEMORY_BYTES: "8589934592"
              TRANSLATION__ENGINE_TIMEOUT_SECONDS: "1800"
              TRANSLATION_WORKER_CONCURRENCY: "1"
              TRANSLATION_PROVIDER_CONCURRENCY: "1"
              TRANSLATION_JOB_TIMEOUT_SECONDS: "1800"
              TRANSLATION_MAX_ATTEMPTS: "3"
              CURRENCY__AUTOMATIC_ENABLED: "true"
            envFrom: &envFrom
              - secretRef:
                  name: translator-secrets
            securityContext: &security
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
            resources:
              requests:
                cpu: 100m
                memory: 4Gi
              limits:
                cpu: "2"
                memory: 6Gi
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet: &health
                    path: /health
                    port: 8000
                    httpHeaders:
                      - name: Host
                        value: translator.${SECRET_DOMAIN}
                  failureThreshold: 30
                  periodSeconds: 10
                  timeoutSeconds: 5
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet: *health
                  periodSeconds: 30
                  timeoutSeconds: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    <<: *health
                    path: /ready
                  periodSeconds: 10
                  timeoutSeconds: 5
          worker:
            image: *image
            args: [worker]
            env: *env
            envFrom: *envFrom
            securityContext: *security
            resources:
              requests:
                cpu: 500m
                memory: 6Gi
              limits:
                cpu: "2"
                memory: 14Gi
    service:
      app:
        controller: translator
        ports:
          http:
            port: 8000
    route:
      app:
        hostnames:
          - translator.${SECRET_DOMAIN}
        parentRefs:
          - name: envoy-external
            namespace: networking
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: http
            timeouts:
              request: 0s
              backendRequest: 0s
    persistence:
      # Each container decrypts its Python environment into its own executable tmpfs.
      api-code:
        type: emptyDir
        medium: Memory
        sizeLimit: 4Gi
        advancedMounts:
          translator:
            app:
              - path: /opt/translator
      worker-code:
        type: emptyDir
        medium: Memory
        sizeLimit: 4Gi
        advancedMounts:
          translator:
            worker:
              - path: /opt/translator
      release:
        type: nfs
        server: ${NFS_SERVER_APPS}
        path: /volume1/apps/default/translator/releases/0.6.0
        globalMounts:
          - path: /release
            readOnly: true
      keys:
        type: secret
        name: translator-keys
        defaultMode: 0440
        globalMounts:
          - path: /run/secrets
            readOnly: true
      tmp:
        type: emptyDir
        medium: Memory
        sizeLimit: 256Mi
        globalMounts:
          - path: /tmp
      api-shm:
        type: emptyDir
        medium: Memory
        sizeLimit: 1Gi
        advancedMounts:
          translator:
            app:
              - path: /dev/shm
      worker-shm:
        type: emptyDir
        medium: Memory
        sizeLimit: 6Gi
        advancedMounts:
          translator:
            worker:
              - path: /dev/shm
