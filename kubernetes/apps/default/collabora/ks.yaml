---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app collabora
  namespace: flux-system
spec:
  components:
    - ../../../../components/ext-auth
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes/apps/default/collabora/app
  targetNamespace: default
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
    namespace: flux-system
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
    substitute:
      APP: collabora
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: collabora
      namespace: default
  interval: 30m
  retryInterval: 1m
  timeout: 5m
