---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: syncthing
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 3
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false

  values:
    defaultPodOptions:
      automountServiceAccountToken: false

    controllers:
      syncthing:
        strategy: Recreate
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: { type: RuntimeDefault }

        containers:
          app:
            image:
              repository: syncthing/syncthing
              tag: 2.1.7@sha256:2b71da7c0d0a91a6ae5285ad079226fecc0a365d08b27720e1f7037b018f7546
            env:
              TZ: ${TIMEZONE}
              STHOMEDIR: ""
              STCONFDIR: /var/syncthing/config
              STDATADIR: /var/syncthing/data
              STGUIADDRESS: 0.0.0.0:8384
              STNOUPGRADE: "true"
              HOME: /var/syncthing/folders
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /rest/noauth/health
                    port: &guiPort 8384
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probe
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 20m
                memory: 128Mi
              limits:
                memory: 1Gi

    service:
      syncthing:
        controller: syncthing
        ports:
          http:
            port: *guiPort

    route:
      syncthing:
        hostnames:
          - "syncthing.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-external
            namespace: networking
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - identifier: syncthing
                port: http

    persistence:
      nfs:
        existingClaim: syncthing-jericho
        advancedMounts:
          syncthing:
            app:
              - subPath: syncthing/config
                path: /var/syncthing/config
              - subPath: syncthing/folders
                path: /var/syncthing/folders
      database:
        existingClaim: syncthing-openebs
        advancedMounts:
          syncthing:
            app:
              - path: /var/syncthing/data
      tmp:
        type: emptyDir
        advancedMounts:
          syncthing:
            app:
              - path: /tmp
