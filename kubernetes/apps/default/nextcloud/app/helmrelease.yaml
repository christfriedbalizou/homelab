---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app nextcloud
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: nextcloud
  values:
    deploymentAnnotations:
      reloader.stakater.com/auto: "true"

    image:
      flavor: apache
      tag: 32.0.2@sha256:8cb1dc8c26944115469dd22f4965d2ed35bab9cf8c48d2bb052c8e9f83821ded

    livenessProbe:
      enabled: false
    readinessProbe:
      enabled: false
    startupProbe:
      enabled: false

    resources:
      requests:
        cpu: 100m
        memory: 363Mi
      limits:
        memory: 512Mi

    persistence:
      enabled: true
      existingClaim: nextcloud-jericho

    cronjob:
      enabled: true
      curlInsecure: true
      failedJobsHistoryLimit: 5
      successfulJobsHistoryLimit: 2
      securityContext:
        runAsUser: ${PUID}
        runAsGroup: ${PGID}
        fsGroup: ${PGID}
        runAsNonRoot: true
        readOnlyRootFilesystem: true

    internalDatabase:
      enabled: false

    externalDatabase:
      enabled: true
      type: postgresql
      host: postgres-lb.storage.svc.cluster.local:5432
      existingSecret:
        enabled: true
        secretName: &secret nextcloud-secrets
        usernameKey: INIT_POSTGRES_USER
        passwordKey: INIT_POSTGRES_PASS
        databaseKey: INIT_POSTGRES_DBNAME

    nextcloud:
      host: nextcloud.${SECRET_DOMAIN}
      hooks:
        before-starting: |-
          #!/bin/sh
          set -eu

          # Shared helpers. Keep configuration values out of log messages.
          log() {
            printf '[nextcloud-startup] %s\n' "$*" >&2
          }

          hook_step=initialization
          trap 'result=$?; if [ "$result" -ne 0 ]; then log "Failed: $hook_step (exit $result)"; fi' 0

          occ() {
            php /var/www/html/occ --no-interaction "$@"
          }

          run_step() {
            hook_step=$1
            shift
            log "Starting: $hook_step"
            "$@"
            log "Completed: $hook_step"
          }

          # Subshells isolate helper variables, including nested retry counters.
          retry() (
            description=$1
            shift
            attempt=1
            until "$@"; do
              if [ "$attempt" -ge 3 ]; then
                log "$description failed after $attempt attempts"
                exit 1
              fi
              log "$description failed (attempt $attempt/3); retrying in 5 seconds"
              sleep 5
              attempt=$((attempt + 1))
            done
          )

          app_state() (
            # Capture separately so a failed occ command cannot be hidden by a pipe.
            apps=$(occ app:list --output=json) || exit 1
            printf '%s\n' "$apps" | php -r '
              $apps = json_decode(stream_get_contents(STDIN), true, 512, JSON_THROW_ON_ERROR);
              if (!isset($apps["enabled"], $apps["disabled"])) {
                  fwrite(STDERR, "Invalid Nextcloud app inventory\n");
                  exit(1);
              }
              $id = $argv[1];
              echo array_key_exists($id, $apps["enabled"]) ? "enabled"
                  : (array_key_exists($id, $apps["disabled"]) ? "disabled" : "missing");
            ' "$1"
          )

          ensure_app() (
            state=$(app_state "$1") || exit 1
            case "$state" in
              enabled) log "$1 is already enabled" ;;
              disabled) occ app:enable "$1" ;;
              missing) occ app:install "$1" ;;
              *) log "Unexpected app state for $1"; exit 1 ;;
            esac
          )

          disable_app() (
            state=$(app_state "$1") || exit 1
            case "$state" in
              enabled) occ app:disable "$1" ;;
              disabled|missing) log "$1 is already disabled or absent" ;;
              *) log "Unexpected app state for $1"; exit 1 ;;
            esac
          )

          set_app_config() {
            log "Setting $1/$2"
            occ config:app:set "$1" "$2" --value="$3" >/dev/null
          }

          # App setup: keep each integration in its own function.
          configure_office() {
            retry "Enable richdocuments" ensure_app richdocuments
            disable_app richdocumentscode
            disable_app richdocumentscode_arm64
            set_app_config richdocuments wopi_url http://collabora.default.svc.cluster.local:9980
            set_app_config richdocuments public_wopi_url https://collabora.${SECRET_DOMAIN}
            set_app_config richdocuments wopi_callback_url http://nextcloud.default.svc.cluster.local:8080
            set_app_config richdocuments wopi_allowlist "${K8S_CLUSTER_CIDR}"
          }

          # Add new configure_<app> functions above and register their steps here.
          cd /var/www/html
          run_step "Nextcloud readiness" retry "Nextcloud readiness" occ status --exit-code
          run_step "Nextcloud Office" configure_office

      lifecycle:
        postStartCommand:
          - /bin/sh
          - -c
          - >-
            cd /var/www/html;
            ./occ maintenance:repair --include-expensive;
            ./occ db:add-missing-indices;
            /bin/true

      extraVolumes:
        - name: nextcloud-redis
          emptyDir: {}

      extraVolumeMounts:
        - name: nextcloud-redis
          mountPath: /usr/local/etc/php/conf.d/redis-session.ini
          subPath: redis-session.ini

      extraInitContainers:
        - name: init-redis
          image: busybox:latest
          command:
            - touch
            - /usr/local/etc/php/conf.d/redis-session.ini
          volumeMounts:
            - name: nextcloud-redis
              mountPath: /usr/local/etc/php/conf.d/

      existingSecret:
        enabled: true
        secretName: *secret

      extraEnv:
        - name: REDIS_HOST
          value: dragonfly.storage.svc.cluster.local
        - name: OIDC_CLIENT_ID
          value: *app
        - name: OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: *secret
              key: OIDC_CLIENT_SECRET

      datadir: /var/www/html/data

      mail:
        enabled: true
        fromAddress: noreply
        domain: ${SECRET_DOMAIN}
        smtp:
          port: ${SMTP_RELAY_PORT}
          secure:
          authtype:
          name:
          password:

      podSecurityContext:
        runAsUser: ${PUID}
        runAsGroup: ${PGID}
        fsGroup: ${PGID}
        runAsNonRoot: true

      objectStorage:
        s3:
          enabled: true
          bucket: nextcloud
          host: minio.storage.svc.cluster.local
          port: 9000
          ssl: false
          autoCreate: true
          existingSecret: *secret
          secretKeys:
            accessKey: MINIO_ACCESS_KEY
            secretKey: MINIO_SECRET_KEY

      defaultConfigs:
        redis.config.php: false

      phpConfigs:
        uploadLimit.ini: |
          upload_max_filesize = 1G
          post_max_size = 1G
          max_input_time = 3600
          max_execution_time = 3600
          default_phone_region = ${TIMEZONE}

      configs:
        redis.config.php: |-
          <?php
          $CONFIG = array (
            'memcache.distributed' => '\OC\Memcache\Redis',
            'memcache.locking' => '\OC\Memcache\Redis',
            'redis' => array (
              'host' => getenv('REDIS_HOST'),
              'port' => 6379,
              'dbindex' => 4,
              'password' => '',
            ),
          );
        local.config.php: |-
          <?php
          $CONFIG = array (
            'trusted_proxies' => array (
              0 => '127.0.0.1',
              1 => '${K8S_CLUSTER_CIDR}',
              2 => '${K8S_SERVICE_CIDR}',
            ),
            'forwarded_for_headers' => array (
              0 => 'HTTP_X_FORWARDED_FOR',
            ),
            'overwrite.cli.url' => 'https://nextcloud.${SECRET_DOMAIN}',
            'overwriteprotocol' => 'https',
            'quota_include_external_storage' => 'false',
            'skeletondirectory' => '',
            'knowledgebaseenabled' => 'false',
            'maintenance_window_start' => '20',
            'enable_previews' => false,
            'trashbin_retention_obligation' => 'auto, 30',
            'auth.bruteforce.protection.enabled' => true,
          );
        gitops.config.php: |-
          <?php
          $CONFIG = array (
            'appstoreenabled' => true,
            'mail_domain' => '${SECRET_DOMAIN}',
          );
        office.config.php: |-
          <?php
          $CONFIG = array (
            // Nextcloud contacts Collabora through its private Kubernetes Service.
            'allow_local_remote_servers' => true,
            'trusted_domains' => array (
              'nextcloud.${SECRET_DOMAIN}',
              'nextcloud.default.svc.cluster.local',
            ),
          );
        bulkupload.config.php: |-
          <?php
          $CONFIG = array (
            'bulkupload.enabled' => false,
          );
        oidc.config.php: |-
          <?php
          $CONFIG = array (
            'allow_user_to_change_display_name' => false,
            'lost_password_link' => 'disabled',
            'oidc_login_provider_url' => 'https://auth.${SECRET_DOMAIN}',
            'oidc_login_client_id' => 'nextcloud',
            'oidc_login_client_secret' => getenv('OIDC_CLIENT_SECRET'),
            'oidc_login_auto_redirect' => true,
            'oidc_login_end_session_redirect' => false,
            'oidc_login_button_text' => 'Log in with Authelia',
            'oidc_login_hide_password_form' => true,
            'oidc_login_use_id_token' => false,
            'oidc_login_attributes' => array(
              'id' => 'preferred_username',
              'name' => 'name',
              'mail' => 'email',
              'groups' => 'groups',
              'is_admin' => 'is_nextcloud_admin',
            ),
            'oidc_login_default_group' => 'oidc',
            'oidc_login_use_external_storage' => false,
            'oidc_login_scope' => 'openid profile email groups nextcloud_userinfo',
            'oidc_login_proxy_ldap' => false,
            'oidc_login_disable_registration' => false,
            'oidc_login_redir_fallback' => false,
            'oidc_login_tls_verify' => true,
            'oidc_create_groups' => false,
            'oidc_login_webdav_enabled' => false,
            'oidc_login_password_authentication' => false,
            'oidc_login_public_key_caching_time' => 86400,
            'oidc_login_min_time_between_jwks_requests' => 10,
            'oidc_login_well_known_caching_time' => 86400,
            'oidc_login_update_avatar' => false,
            'oidc_login_code_challenge_method' => 'S256',
          );
  dependsOn:
    - name: collabora
      namespace: default
    - name: cloudnative-pg
      namespace: storage
