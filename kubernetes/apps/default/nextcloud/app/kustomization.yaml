---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: default
resources:
  - ./helmrelease.yaml
  - ./httproute.yaml
  - ./secret.sops.yaml
configMapGenerator:
  - name: nextcloud-startup-hooks
    files:
      - before-starting.sh=./resources/before-starting.sh
generatorOptions:
  disableNameSuffixHash: true
