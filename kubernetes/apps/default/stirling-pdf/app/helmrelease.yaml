---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: stirling-pdf
spec:
  interval: 10m
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false

  values:
    controllers:
      stirling-pdf:
        type: deployment
        replicas: 1
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: { type: RuntimeDefault }
        containers:
          main:
            image:
              repository: ghcr.io/stirling-tools/stirling-pdf
              tag: 3.3.0@sha256:ed7b1775c6706b5e5ea24fa6155f078eff1027bd35a17d21834e4407036025e6
            env:
              TZ: ${TIMEZONE}
              DOCKER_ENABLE_SECURITY: false
              LANGS: &lang en_GB
              METRICS_ENABLED: false
              SYSTEM_DEFAULTLOCALE:  *lang
              SYSTEM_ENABLEANALYTICS: false
              SECURITY_ENABLELOGIN: true
              SECURITY_LOGINMETHOD: oauth2
              SECURITY_SSOAUTOLOGIN: true
              SECURITY_INITIALLOGIN_USERNAME: stirling-admin
              SECURITY_OAUTH2_ENABLED: true
              SECURITY_OAUTH2_PROVIDER: authelia
              SECURITY_OAUTH2_ISSUER: https://auth.${SECRET_DOMAIN}
              SECURITY_OAUTH2_CLIENTID: stirling-pdf
              SECURITY_OAUTH2_SCOPES: openid, profile, email
              SECURITY_OAUTH2_USEASUSERNAME: preferred_username
              SECURITY_OAUTH2_AUTOCREATEUSER: true
              SECURITY_OAUTH2_REDIRECTBASEURL: https://pdf.${SECRET_DOMAIN}
              STORAGE_ENABLED: false
              SYSTEM_GOOGLEVISIBILITY: false
              SYSTEM_SHOW_UPDATE: false
              SYSTEM_TEMPFILEMANAGEMENT_BASETMPDIR: /tmp/stirling-pdf
              SYSTEM_TEMPFILEMANAGEMENT_MAXAGEHOURS: "1"
              SYSTEM_TEMPFILEMANAGEMENT_CLEANUPINTERVALMINUTES: "5"
              SYSTEM_TEMPFILEMANAGEMENT_STARTUPCLEANUP: "true"
            envFrom:
              - secretRef:
                  name: cluster-stirling-pdf-secrets
            resources:
              requests:
                cpu: "10m"
                memory: "512Mi"
              limits:
                cpu: "1"
                memory: 2Gi

    service:
      stirling-pdf:
        controller: stirling-pdf
        ports:
          http:
            port: 8080

    route:
      main:
        hostnames:
          - "pdf.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-external
            namespace: networking
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - identifier: stirling-pdf
                port: http
    persistence:
      config:
        existingClaim: stirling-pdf-openebs
        globalMounts:
          - path: /configs
      temporary:
        type: emptyDir
        medium: Memory
        globalMounts:
          - path: /customFiles
            subPath: customFiles
          - path: /logs
            subPath: logs
          - path: /pipeline
            subPath: pipeline
          - path: /tmp
            subPath: tmp
          - path: /usr/share/tessdata
            subPath: tessdata
          - path: /home/stirlingpdfuser
            subPath: home
          - path: /usr/local/bin
            subPath: usrLocalBin
