---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  dependsOn:
    - name: cloudnative-pg
      namespace: storage
  values:
    controllers:
      immich:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          automountServiceAccountToken: false
          enableServiceLinks: false
          securityContext:
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: { type: RuntimeDefault }
        containers:
          app:
            image:
              repository: ghcr.io/immich-app/immich-server
              tag: v3.2.4@sha256:d317916b28090c33eb36b308464ea391f8b7df1d850fcfea227a39ec879718c2
            env:
              TZ: ${TIMEZONE}
              IMMICH_CONFIG_FILE: /config/immich.json
              IMMICH_LOG_LEVEL: log
              IMMICH_TRUSTED_PROXIES: "${K8S_CLUSTER_CIDR},${K8S_SERVICE_CIDR}"
              IMMICH_MACHINE_LEARNING_URL: http://127.0.0.1:3003
              DB_HOSTNAME: &postgres postgres-lb.storage.svc.cluster.local
              DB_PORT: "5432"
              DB_DATABASE_NAME: &db immich
              DB_VECTOR_EXTENSION: pgvector
              REDIS_HOSTNAME: 127.0.0.1
              REDIS_PORT: "6379"
              REDIS_DBINDEX: "0"
              DB_USERNAME:
                valueFrom:
                  secretKeyRef:
                    name: &secret cluster-immich-secrets
                    key: DB_USERNAME
              DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: *secret
                    key: DB_PASSWORD
            probes:
              liveness: &serverProbe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /server/ping
                    port: &serverPort 2283
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *serverProbe
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /server/ping
                    port: *serverPort
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 30
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 4Gi

          machine-learning:
            image:
              repository: ghcr.io/immich-app/immich-machine-learning
              tag: v3.2.4@sha256:e16c2f166a8174901959fdf85e2e4c7bd1ebc4b37e0b6655de97c41408a260c4
            env:
              TZ: ${TIMEZONE}
              MACHINE_LEARNING_CACHE_FOLDER: /cache
              MACHINE_LEARNING_MODEL_TTL: "300"
              MACHINE_LEARNING_WORKERS: "1"
            probes:
              liveness: &mlProbe
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &mlPort 3003
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *mlProbe
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *mlPort
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 30
            resources:
              requests:
                cpu: 250m
                memory: 1Gi
              limits:
                memory: 4Gi

          # Keep Immich on local Valkey: Bull queue Lua scripts fail against the
          # shared Dragonfly cluster with undeclared-key script errors.
          valkey:
            image:
              repository: docker.io/valkey/valkey
              tag: 9@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd
            args:
              - valkey-server
              - --appendonly
              - "yes"
              - --dir
              - /data
            probes:
              liveness: &valkeyProbe
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - valkey-cli
                      - ping
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *valkeyProbe
            resources:
              requests:
                cpu: 25m
                memory: 64Mi
              limits:
                memory: 512Mi
            securityContext:
              runAsNonRoot: true
              runAsUser: 999
              runAsGroup: 999

    service:
      valkey:
        controller: immich
        ports:
          valkey:
            port: 6379
      app:
        controller: immich
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: 192.168.0.82
        ports:
          http:
            port: *serverPort
      machine-learning:
        controller: immich
        ports:
          http:
            port: *mlPort

    route:
      app:
        hostnames:
          - "immich.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-external
            namespace: networking
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - identifier: app
                port: http
    persistence:
      library:
        existingClaim: immich-jericho
        advancedMounts:
          immich:
            app:
              - subPath: immich/library
                path: /data
            machine-learning:
              - subPath: immich/machine-learning
                path: /cache
            valkey:
              - subPath: immich/valkey
                path: /data
      config:
        type: secret
        name: cluster-immich-secrets
        advancedMounts:
          immich:
            app:
              - path: /config/immich.json
                subPath: immich.json
                readOnly: true
