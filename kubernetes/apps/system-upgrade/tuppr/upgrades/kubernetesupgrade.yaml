---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/tuppr.home-operations.com/kubernetesupgrade_v1alpha1.json
apiVersion: tuppr.home-operations.com/v1alpha1
kind: KubernetesUpgrade
metadata:
  name: kubernetes
spec:
  kubernetes:
    # renovate: datasource=docker depName=ghcr.io/siderolabs/kubelet
    version: v1.37.1
  healthChecks:
    # The current Talos release supplies the Kubernetes upgrade client's version.
    - apiVersion: tuppr.home-operations.com/v1alpha1
      kind: TalosUpgrade
      expr: >-
        status.phase == 'Completed' &&
        status.observedGeneration == object.metadata.generation
    - apiVersion: v1
      kind: Node
      expr: status.conditions.exists(c, c.type == "Ready" && c.status == "True")
