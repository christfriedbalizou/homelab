---
- id: frigate_front_door_private_area_person
  alias: Frigate - person in Front Door Private Area
  description: Notify the Pixel 6 once per tracked person with a Frigate snapshot.
  triggers:
    - trigger: mqtt
      topic: frigate/events
  conditions:
    - condition: template
      value_template: >-
        {% set event = trigger.payload_json | default({}, true) %}
        {% set after = event.get('after', {}) %}
        {% set before = event.get('before', {}) %}
        {% set zone = 'front_door_private_area' %}
        {{ after.get('camera') == 'entrance'
           and after.get('label') == 'person'
           and not after.get('false_positive', true)
           and zone in after.get('entered_zones', [])
           and after.get('has_snapshot', false)
           and (event.get('type') == 'new'
                or zone not in before.get('entered_zones', [])
                or not before.get('has_snapshot', false)) }}
  actions:
    - action: notify.mobile_app_pixel_6
      data:
        title: Front Door
        message: Someone is in the Front Door Private Area.
        data:
          image: "/api/frigate/notifications/{{ trigger.payload_json.after.id }}/snapshot.jpg"
          clickAction: "/api/frigate/notifications/{{ trigger.payload_json.after.id }}/snapshot.jpg"
          tag: "frigate-private-area-{{ trigger.payload_json.after.id }}"
          group: frigate-front-door
          alert_once: true
          ttl: 0
          priority: high
  mode: parallel
  max: 10
