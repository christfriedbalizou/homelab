<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Front Door snapshot</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; background: #111; color: white; }
    body { display: flex; flex-direction: column; height: 100dvh; font: 16px system-ui, sans-serif; }
    header { padding: max(12px, env(safe-area-inset-top)) 16px 12px; }
    main { flex: 1; min-height: 0; display: grid; place-items: center; padding-bottom: env(safe-area-inset-bottom); }
    img { display: block; width: 100%; height: 100%; min-height: 0; object-fit: contain; }
    [hidden] { display: none !important; }
    #status { padding: 16px; }
  </style>
</head>
<body>
  <header>Front Door snapshot</header>
  <main>
    <p id="status" role="status">Loading snapshot…</p>
    <img id="snapshot" alt="Front Door event snapshot" hidden>
  </main>
  <script>
    const eventId = new URLSearchParams(location.search).get('event') || '';
    const picture = document.getElementById('snapshot');
    const status = document.getElementById('status');
    if (!/^\d+(?:\.\d+)?-[A-Za-z0-9]+$/.test(eventId)) {
      status.textContent = 'This notification has an invalid event link.';
    } else {
      picture.onload = () => { status.hidden = true; picture.hidden = false; };
      picture.onerror = () => {
        status.textContent = 'The snapshot is unavailable. It may have expired, or Home Assistant cannot reach Frigate.';
      };
      picture.src = '/api/frigate/notifications/' + encodeURIComponent(eventId) + '/snapshot.jpg';
    }
  </script>
</body>
</html>
