---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: netbird
spec:
  interval: 10m
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    controllers:
      management:
        annotations:
          reloader.stakater.com/auto: "true"
        replicas: 1
        strategy: RollingUpdate
        rollingUpdate:
          surge: "0"
          unavailable: 1
        pod:
          automountServiceAccountToken: false
          securityContext:
            seccompProfile: { type: RuntimeDefault }
        initContainers:
          01-init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18
              pullPolicy: IfNotPresent
            envFrom:
              - secretRef:
                  name: netbird-secret
          02-render-config:
            image: &serverImage
              repository: netbirdio/netbird-server
              tag: 0.77.1@sha256:e71f39cefcd90956d818dc4179084fd47d39f0741d1211b818ec640766b5794d
            command:
              - sh
              - -c
              - |
                set -eu
                umask 077
                sed \
                  -e "s|@@RELAY_PASSWORD@@|$RELAY_PASSWORD|g" \
                  -e "s|@@DATASTORE_ENCRYPTION_KEY@@|$DATASTORE_ENCRYPTION_KEY|g" \
                  -e "s|@@STUN_SERVER@@|$STUN_SERVER|g" \
                  /config-template/config.yaml > /config/config.yaml
            envFrom:
              - secretRef:
                  name: netbird-secret
        containers:
          app:
            image: *serverImage
            args:
              - --config
              - /etc/netbird/config.yaml
            env:
              TZ: ${TIMEZONE}
            envFrom:
              - secretRef:
                  name: netbird-secret
            probes:
              liveness: &serverProbes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /oauth2/.well-known/openid-configuration
                    port: 80
                    scheme: HTTP
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
              readiness: *serverProbes

      dashboard:
        replicas: 1
        strategy: RollingUpdate
        pod:
          automountServiceAccountToken: false
          securityContext:
            seccompProfile: { type: RuntimeDefault }
        containers:
          app:
            image:
              repository: netbirdio/dashboard
              tag: v2.91.1@sha256:f3eb26c93ca9901a7385e88e12f6ad98d04e075e8817c664d73557fea123875f
            env:
              AUTH_AUDIENCE: netbird-dashboard
              AUTH_AUTHORITY: https://netbird.${SECRET_DOMAIN}/oauth2
              AUTH_CLIENT_ID: netbird-dashboard
              AUTH_CLIENT_SECRET: ""
              AUTH_REDIRECT_URI: /nb-auth
              AUTH_SILENT_REDIRECT_URI: /nb-silent-auth
              AUTH_SUPPORTED_SCOPES: openid profile email groups
              NETBIRD_MGMT_API_ENDPOINT: &management https://netbird.${SECRET_DOMAIN}:443
              NETBIRD_MGMT_GRPC_API_ENDPOINT: *management
              NETBIRD_TOKEN_SOURCE: accessToken
              USE_AUTH0: "false"
            probes:
              liveness: &dashboardProbes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port80 80
                    scheme: HTTP
                  initialDelaySeconds: 5
                  periodSeconds: 5
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *dashboardProbes

    service:
      management:
        controller: management
        ports:
          http:
            primary: true
            port: *port80
          metrics:
            port: 9090
      dashboard:
        controller: dashboard
        ports:
          http:
            primary: true
            port: *port80

    route:
      management:
        annotations:
          external-dns.alpha.kubernetes.io/controller: none
          gatus.home-operations.com/enabled: "false"
        hostnames:
          - "netbird.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-external
            namespace: networking
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /api
            backendRefs: &serverBackend
              - identifier: management
                port: http
          - matches:
              - path:
                  type: PathPrefix
                  value: /oauth2
            backendRefs: *serverBackend
          - matches:
              - path:
                  type: PathPrefix
                  value: /relay
            backendRefs: *serverBackend
          - matches:
              - path:
                  type: PathPrefix
                  value: /ws-proxy
            backendRefs: *serverBackend
      grpc:
        kind: GRPCRoute
        hostnames:
          - "netbird.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-external
            namespace: networking
        rules:
          - matches:
              - method:
                  service: management.ManagementService
            backendRefs: *serverBackend
          - matches:
              - method:
                  service: management.ProxyService
            backendRefs: *serverBackend
          - matches:
              - method:
                  service: signalexchange.SignalExchange
            backendRefs: *serverBackend
      dashboard:
        annotations:
          external-dns.alpha.kubernetes.io/controller: none
          gatus.home-operations.com/enabled: "false"
        hostnames:
          - "netbird.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-external
            namespace: networking
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - identifier: dashboard
                port: http

    persistence:
      config-template:
        type: configMap
        name: netbird-configmap
        advancedMounts:
          management:
            02-render-config:
              - path: /config-template
                readOnly: true
      config:
        type: emptyDir
        advancedMounts:
          management:
            02-render-config:
              - path: /config
            app:
              - path: /etc/netbird
                readOnly: true
      data:
        enabled: true
        existingClaim: netbird-management-jericho
        advancedMounts:
          management:
            app:
              - path: /var/lib/netbird
                subPath: netbird
