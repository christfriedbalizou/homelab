---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/databaserole_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: vaultwarden
spec:
  cluster:
    name: postgres18
  name: vaultwarden
  login: true
  inherit: true
  superuser: false
  createdb: false
  createrole: false
  replication: false
  bypassrls: false
  connectionLimit: -1
  databaseRoleReclaimPolicy: retain
  passwordSecret:
    name: vaultwarden-db
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/database_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: vaultwarden
spec:
  cluster:
    name: postgres18
  name: vaultwarden
  owner: vaultwarden
  databaseReclaimPolicy: retain
