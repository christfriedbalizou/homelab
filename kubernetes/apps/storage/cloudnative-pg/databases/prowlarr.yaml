---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/databaserole_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: prowlarr
spec:
  cluster:
    name: postgres18
  name: prowlarr
  login: true
  inherit: true
  superuser: false
  createdb: false
  createrole: false
  replication: false
  bypassrls: false
  connectionLimit: -1
  databaseRoleReclaimPolicy: retain
  passwordSecret:
    name: prowlarr-db
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/database_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: prowlarr
spec:
  cluster:
    name: postgres18
  name: prowlarr
  owner: prowlarr
  databaseReclaimPolicy: retain
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/database_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: prowlarr-log
spec:
  cluster:
    name: postgres18
  name: prowlarr-log
  owner: prowlarr
  databaseReclaimPolicy: retain
