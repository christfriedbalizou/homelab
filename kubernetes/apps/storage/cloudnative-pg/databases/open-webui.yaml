---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/databaserole_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: open-webui
spec:
  cluster:
    name: postgres18
  name: open_webui
  login: true
  inherit: true
  superuser: false
  createdb: false
  createrole: false
  replication: false
  bypassrls: false
  connectionLimit: -1
  databaseRoleReclaimPolicy: retain
  passwordSecret:
    name: open-webui-db
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/database_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: open-webui
spec:
  cluster:
    name: postgres18
  name: open_webui
  owner: open_webui
  databaseReclaimPolicy: retain
