---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app n8n
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      n8n:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/n8n-io/n8n
              tag: 2.42.3@sha256:240eaa2a3d491adac5817aa4c3f1c521bb18ec79f6e448517158d5220ee0f37b
            env:
              # Timezone and localization environment variables
              GENERIC_TIMEZONE: "${TIMEZONE}"

              # Execution
              EXECUTIONS_DATA_PRUNE: true
              EXECUTIONS_DATA_MAX_AGE: 7
              EXECUTIONS_DATA_PRUNE_MAX_COUNT: 50000

              # Security
              N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: false

              # Deployment
              N8N_PROTOCOL: "https"
              N8N_PORT: &port 8080
              N8N_HOST: &host n8n.${SECRET_DOMAIN}
              N8N_PUBLIC_API_DISABLED: true
              N8N_PUBLIC_API_SWAGGERUI_DISABLED: true
              N8N_USER_FOLDER: /home/n8n/app
              N8N_PERSONALIZATION_ENABLED: false
              N8N_HIRING_BANNER_ENABLED: false

              # Logs
              N8N_LOG_LEVEL: info
              N8N_LOG_OUTPUT: console

              # Endpoints
              N8N_METRICS: true

              # Database
              DB_TYPE: postgresdb
              DB_POSTGRESDB_HOST: &postgres postgres-lb.storage.svc.cluster.local

              # User Management
              N8N_SMTP_HOST: smtp-relay.networking.svc.cluster.local
              N8N_SMTP_PORT: "${SMTP_RELAY_PORT}"
              N8N_SMTP_SENDER: "N8N <noreply@${SECRET_DOMAIN}>"
              N8N_SMTP_SSL: false
              N8N_EMAIL_MODE: smtp
            envFrom:
              - secretRef:
                  name: &secret cluster-n8n-secrets
            resources:
              requests:
                cpu: 5m
                memory: 128Mi
              limits:
                memory: 2Gi
        pod:
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: "OnRootMismatch"
    service:
      app:
        controller: n8n
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - "n8n.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-external
            namespace: networking
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - identifier: app
                port: http
    persistence:
      config:
        existingClaim: n8n-jericho
        advancedMounts:
          n8n:
            app:
              - subPath: n8n
                path: /home/n8n/app
  dependsOn:
    - name: cloudnative-pg
      namespace: storage
