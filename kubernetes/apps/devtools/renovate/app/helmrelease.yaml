---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: renovate
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      renovate:
        type: cronjob
        cronjob:
          schedule: "0 3 * * *"
          timeZone: "${TIMEZONE}"
          concurrencyPolicy: Forbid
          successfulJobsHistory: 1
          failedJobsHistory: 2
        containers:
          app:
            image:
              repository: ghcr.io/renovatebot/renovate
              tag: 44.227.4
            env:
              LOG_LEVEL: info
              RENOVATE_PLATFORM: forgejo
              RENOVATE_ENDPOINT: "https://git.${SECRET_DOMAIN}/api/v1"
              RENOVATE_AUTODISCOVER: "true"
              RENOVATE_ONBOARDING: "true"
            # Provides RENOVATE_TOKEN and, once added, the read-only
            # GITHUB_COM_TOKEN. Without the latter, anonymous api.github.com
            # rate limits stop Renovate installing uv/node for lockfile updates.
            # (app-template's schema rejects `optional` on secretKeyRef.)
            envFrom:
              - secretRef:
                  name: cluster-renovate-secrets
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 2Gi
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 12021
            runAsGroup: 12021
            fsGroup: 12021
            fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: renovate
        enabled: false
    persistence:
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
