---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nvidia-gpu-operator
  namespace: kube-system
spec:
  interval: 15m
  chart:
    spec:
      chart: gpu-operator
      version: v26.3.1
      sourceRef:
        kind: HelmRepository
        name: nvidia
        namespace: kube-system
  maxHistory: 2
  install:
    crds: CreateReplace
    disableWait: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    disableWait: true
    remediation:
      retries: 3
  rollback:
    disableWait: true
  uninstall:
    keepHistory: false
  values:
    ccManager:
      enabled: false
    cdi:
      enabled: false
    dcgmExporter:
      enabled: true
      repository: nvcr.io/nvidia/k8s
      image: dcgm-exporter
      version: 4.5.1-4.8.0-distroless@sha256:b5d8813707469c5717ce27a5fefb933a29e8ba6cd2fd7d93ad3dcd6ae18579ef
      imagePullPolicy: IfNotPresent
      serviceMonitor:
        enabled: true
        interval: 15s
    validator:
      repository: nvcr.io/nvidia
      image: gpu-operator
      version: v26.3.1@sha256:327518e7157e9634eab9aeb51abfba816845fad47177ca985e1b34d202a1f51e
      imagePullPolicy: IfNotPresent
    operator:
      repository: nvcr.io/nvidia
      image: gpu-operator
      version: v26.3.1@sha256:327518e7157e9634eab9aeb51abfba816845fad47177ca985e1b34d202a1f51e
      imagePullPolicy: IfNotPresent
    driver:
      enabled: false
      manager:
        repository: nvcr.io/nvidia/cloud-native
        image: k8s-driver-manager
        version: v0.12.1@sha256:37e6bf0cf02b5888288a173353b858da8823cc9f9fb9c6e8d6d1e2cf5bfb16c8
        imagePullPolicy: IfNotPresent
        env:
          - name: NODE_LABEL_FOR_GPU_POD_EVICTION
            value: feature.node.kubernetes.io/pci-10de.present
    hostPaths:
      driverInstallDir: /usr/local
    nfd:
      enabled: false
    gfd:
      enabled: true
    kataSandboxDevicePlugin:
      enabled: false
    migManager:
      enabled: false
    sandboxDevicePlugin:
      enabled: false
    toolkit:
      enabled: false
    vfioManager:
      enabled: false
    vgpuDeviceManager:
      enabled: false
    devicePlugin:
      enabled: true
      config:
        name: nvidia-time-slicing
        default: any
