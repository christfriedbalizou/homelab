---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nvidia-gpu-operator
  namespace: kube-system
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: nvidia
  maxHistory: 2
  install:
    crds: CreateReplace
    disableWait: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    disableWait: true
    remediation:
      retries: 3
  rollback:
    disableWait: true
  uninstall:
    keepHistory: false
  values:
    ccManager:
      enabled: false
    cdi:
      enabled: false
    dcgmExporter:
      enabled: true
      repository: nvcr.io/nvidia/k8s
      image: dcgm-exporter
      version: 4.5.1-4.8.0-distroless@sha256:b5d8813707469c5717ce27a5fefb933a29e8ba6cd2fd7d93ad3dcd6ae18579ef
      imagePullPolicy: IfNotPresent
      serviceMonitor:
        enabled: true
        interval: 15s
    validator:
      repository: nvcr.io/nvidia
      image: gpu-operator
      version: v26.7.3@sha256:18883be4960102f24997273572015fb380801d1c791bbe6f8a599cc67e180c29
      imagePullPolicy: IfNotPresent
    operator:
      repository: nvcr.io/nvidia
      image: gpu-operator
      version: v26.7.3@sha256:18883be4960102f24997273572015fb380801d1c791bbe6f8a599cc67e180c29
      imagePullPolicy: IfNotPresent
    driver:
      enabled: false
      manager:
        repository: nvcr.io/nvidia/cloud-native
        image: k8s-driver-manager
        version: v0.13.0@sha256:c48dd0248777af64a4c1059982eafc5b0fc28ec2d98995c407af2b1bd8449fc3
        imagePullPolicy: IfNotPresent
        env:
          - name: NODE_LABEL_FOR_GPU_POD_EVICTION
            value: feature.node.kubernetes.io/pci-10de.present
    hostPaths:
      driverInstallDir: /usr/local
    nfd:
      enabled: false
    gfd:
      enabled: true
    kataSandboxDevicePlugin:
      enabled: false
    migManager:
      enabled: false
    sandboxDevicePlugin:
      enabled: false
    toolkit:
      enabled: false
    vfioManager:
      enabled: false
    vgpuDeviceManager:
      enabled: false
    devicePlugin:
      enabled: true
      config:
        name: nvidia-time-slicing
        default: any
