---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: gpt-6-astra-cloud
spec:
  # Explicitly selected external model; never a fallback for a local alias.
  modelName: openai-gpt-6-astra-cloud
  params:
    model: openai/gpt-6-astra
    apiBase: https://api.openai.com/v1
    apiKeyRef:
      name: cluster-litellm-openai-secrets
      key: OPENAI_API_KEY
    additional:
      # Astra requires reasoning; none is not supported.
      reasoning_effort: low
      # This budget includes both reasoning and visible output tokens.
      max_completion_tokens: 8192
      store: false
  info:
    maxTokens: 1050000
    maxInputTokens: 1050000
    maxOutputTokens: 8192
    # Astra tool calling requires Responses, not this Chat Completions route.
    supportsFunctionCalling: false
    supportsVision: true
    extra:
      supports_reasoning: true
      disable_background_health_check: true
