---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/batch/job_v1.json
# Separate bootstrap Job because LiteLLMProxy cannot declare init containers.
# Keep the completed Job so Flux can use it as a dependency; do not add a TTL.
apiVersion: batch/v1
kind: Job
metadata:
  name: litellm-init-db
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: litellm-init-db
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      initContainers:
        - name: init-db
          image: ghcr.io/home-operations/postgres-init:18
          env:
            - name: INIT_POSTGRES_DBNAME
              value: litellm
            - name: INIT_POSTGRES_HOST
              value: postgres-lb.storage.svc.cluster.local
            - name: INIT_POSTGRES_SUPER_PASS
              value: ${POSTGRES_SUPER_PASS}
            - name: INIT_POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: cluster-litellm-secrets
                  key: POSTGRES_USER
            - name: INIT_POSTGRES_PASS
              valueFrom:
                secretKeyRef:
                  name: cluster-litellm-secrets
                  key: POSTGRES_PASSWORD
      containers:
        - name: complete
          image: ghcr.io/home-operations/postgres-init:18
          command:
            - /bin/sh
            - -c
            - exit 0
