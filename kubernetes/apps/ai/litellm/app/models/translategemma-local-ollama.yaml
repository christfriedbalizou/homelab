---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: translategemma-local-ollama
spec:
  modelName: translategemma-local
  params:
    model: ollama_chat/translategemma:4b-it-q4_K_M
    apiBase: http://ollama.ai.svc.cluster.local:11434
    additional:
      reasoning_effort: none
      num_ctx: 8192
      max_tokens: 4096
  info:
    maxTokens: 8192
    maxInputTokens: 8192
    maxOutputTokens: 4096
    supportsFunctionCalling: false
    extra:
      disable_background_health_check: true
