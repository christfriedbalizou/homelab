---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: llama-cpp
  namespace: flux-system
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: llama-cpp
  path: ./kubernetes/apps/ai/llama-cpp/app
  targetNamespace: ai
  prune: true
  wait: true
  interval: 30m
  retryInterval: 2m
  timeout: 60m
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
    namespace: flux-system
  dependsOn:
    - name: nvidia
      namespace: kube-system
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: llama-cpp-qwen3-1-7b-q8
      namespace: ai
    - apiVersion: apps/v1
      kind: Deployment
      name: llama-cpp-translategemma-4b-q4
      namespace: ai
    - apiVersion: apps/v1
      kind: Deployment
      name: llama-cpp-qwen3-5-0-8b-q4
      namespace: ai
    - apiVersion: apps/v1
      kind: Deployment
      name: llama-cpp-granite-4-h-tiny-q4
      namespace: ai
    - apiVersion: apps/v1
      kind: Deployment
      name: llama-cpp-gemma4-e2b-q4
      namespace: ai
