---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: llama-cpp
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    disableWait: true
    remediation:
      retries: 3
  upgrade:
    disableWait: true
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault

    controllers:
      qwen3-1-7b-q8:
        strategy: Recreate
        pod: &cpuPod
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: In
                        values:
                          - k8s-6
                          - k8s-7
        initContainers:
          download:
            image: &curl
              repository: docker.io/curlimages/curl
              tag: 8.23.0@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
            command: &download
              - /bin/sh
              - -c
              - |
                set -eu
                dest="/models/$MODEL_FILE"
                part="$dest.part"
                verified() { echo "$MODEL_SHA256  $1" | sha256sum -c -s -; }
                [ -f "$dest" ] && exit 0
                if [ -f "$part" ] && verified "$part"; then mv "$part" "$dest"; exit 0; fi
                curl -fL --retry 5 --retry-all-errors --retry-delay 10 -C - --no-progress-meter -o "$part" "$MODEL_URL"
                if ! verified "$part"; then rm -f "$part"; echo "checksum mismatch for $MODEL_FILE" >&2; exit 1; fi
                mv "$part" "$dest"
            env:
              MODEL_FILE: Qwen3-1.7B-Q8_0.gguf
              MODEL_URL: https://huggingface.co/Qwen/Qwen3-1.7B-GGUF/resolve/90862c4b9d2787eaed51d12237eafdfe7c5f6077/Qwen3-1.7B-Q8_0.gguf
              MODEL_SHA256: 061b54daade076b5d3362dac252678d17da8c68f07560be70818cace6590cb1a
            resources: &downloadResources
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 256Mi
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
        containers:
          app:
            image: &image
              repository: ghcr.io/ggml-org/llama.cpp
              tag: server-b12464@sha256:5b43086e3ba7ea5794d72904654f6cd41224a9b1c6ac0398f4940ee380d30f23
            args: [--model, /models/Qwen3-1.7B-Q8_0.gguf, --alias, qwen3-1.7b-q8-local, --host, 0.0.0.0, --port, "8080", --ctx-size, "4096", --parallel, "1", --batch-size, "512", --ubatch-size, "512", --jinja, --cont-batching, --threads, "4", --threads-batch, "8", --metrics]
            probes: &probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8080
                  periodSeconds: 10
                  failureThreshold: 60
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8080
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 6
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8080
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 6
            resources:
              requests:
                cpu: "2"
                memory: 3Gi
              limits:
                memory: 5Gi
            securityContext: *securityContext

      translategemma-4b-q4:
        strategy: Recreate
        pod: *cpuPod
        initContainers:
          download:
            image: *curl
            command: *download
            env:
              MODEL_FILE: translategemma-4b-it.Q4_K_M.gguf
              MODEL_URL: https://huggingface.co/mradermacher/translategemma-4b-it-GGUF/resolve/d37868f759d2f817a43d28dd80cf9f982ffa62fd/translategemma-4b-it.Q4_K_M.gguf
              MODEL_SHA256: 81200d03e843d2ec1ece6eeafe7d13cb6e5211e1fcd336ade55790b683a08330
            resources: *downloadResources
            securityContext: *securityContext
        containers:
          app:
            image: *image
            args: [--model, /models/translategemma-4b-it.Q4_K_M.gguf, --alias, translategemma-4b-q4-local, --host, 0.0.0.0, --port, "8080", --ctx-size, "4096", --parallel, "1", --batch-size, "512", --ubatch-size, "512", --jinja, --cont-batching, --threads, "4", --threads-batch, "8", --metrics]
            probes: *probes
            resources:
              requests:
                cpu: "2"
                memory: 4Gi
              limits:
                memory: 6Gi
            securityContext: *securityContext

      qwen3-5-0-8b-q4:
        strategy: Recreate
        pod: *cpuPod
        initContainers:
          download:
            image: *curl
            command: *download
            env:
              MODEL_FILE: Qwen3.5-0.8B-Q4_K_M.gguf
              MODEL_URL: https://huggingface.co/unsloth/Qwen3.5-0.8B-GGUF/resolve/6ab461498e2023f6e3c1baea90a8f0fe38ab64d0/Qwen3.5-0.8B-Q4_K_M.gguf
              MODEL_SHA256: bd258782e35f7f458f8aced1adc053e6e92e89bc735ba3be89d38a06121dc517
            resources: *downloadResources
            securityContext: *securityContext
        containers:
          app:
            image: *image
            args: [--model, /models/Qwen3.5-0.8B-Q4_K_M.gguf, --alias, qwen3.5-0.8b-q4-local, --host, 0.0.0.0, --port, "8080", --ctx-size, "65536", --parallel, "1", --batch-size, "2048", --ubatch-size, "512", --cache-reuse, "256", --jinja, --cont-batching, --threads, "8", --threads-batch, "16", --metrics]
            probes: *probes
            resources:
              requests:
                cpu: "2"
                memory: 2Gi
              limits:
                memory: 3Gi
            securityContext: *securityContext

      granite-4-h-1b-q4:
        strategy: Recreate
        pod: *cpuPod
        initContainers:
          download:
            image: *curl
            command: *download
            env:
              MODEL_FILE: granite-4.0-h-1b-Q4_K_M.gguf
              MODEL_URL: https://huggingface.co/unsloth/granite-4.0-h-1b-GGUF/resolve/74f5511840300fdee7c70ccfc5bd57ecde0c8bbc/granite-4.0-h-1b-Q4_K_M.gguf
              MODEL_SHA256: fd3b85f09520df9d898e2bbcf5da22fc518dbf9d662bb52e214d946c72aafacc
            resources: *downloadResources
            securityContext: *securityContext
        containers:
          app:
            image: *image
            args: [--model, /models/granite-4.0-h-1b-Q4_K_M.gguf, --alias, granite-4.0-h-1b-q4-local, --host, 0.0.0.0, --port, "8080", --ctx-size, "65536", --parallel, "1", --batch-size, "2048", --ubatch-size, "512", --cache-reuse, "256", --jinja, --cont-batching, --threads, "8", --threads-batch, "16", --metrics]
            probes: *probes
            resources:
              requests:
                cpu: "2"
                memory: 2Gi
              limits:
                memory: 3Gi
            securityContext: *securityContext

      gemma4-e2b-q4:
        strategy: Recreate
        pod: *cpuPod
        initContainers:
          download:
            image: *curl
            command: *download
            env:
              MODEL_FILE: gemma-4-E2B-it-Q4_K_M.gguf
              MODEL_URL: https://huggingface.co/unsloth/gemma-4-E2B-it-GGUF/resolve/0314792d7f1f7e229411f620751375812bb9faf2/gemma-4-E2B-it-Q4_K_M.gguf
              MODEL_SHA256: 740185b21d22ceb83a11c3aa62ad5842ef32c70f6096d756bbee85a1e4ec34b8
            resources: *downloadResources
            securityContext: *securityContext
        containers:
          app:
            image: *image
            args: [--model, /models/gemma-4-E2B-it-Q4_K_M.gguf, --alias, gemma4-e2b-q4-local, --host, 0.0.0.0, --port, "8080", --ctx-size, "65536", --parallel, "1", --batch-size, "2048", --ubatch-size, "512", --cache-reuse, "256", --jinja, --cont-batching, --threads, "8", --threads-batch, "16", --metrics]
            probes: *probes
            resources:
              requests:
                cpu: "2"
                memory: 4Gi
              limits:
                memory: 6Gi
            securityContext: *securityContext

      qwen3-embedding-0-6b:
        strategy: Recreate
        pod:
          runtimeClassName: nvidia
        initContainers:
          download:
            image: *curl
            command: *download
            env:
              MODEL_FILE: Qwen3-Embedding-0.6B-Q8_0.gguf
              MODEL_URL: https://huggingface.co/Qwen/Qwen3-Embedding-0.6B-GGUF/resolve/370f27d7550e0def9b39c1f16d3fbaa13aa67728/Qwen3-Embedding-0.6B-Q8_0.gguf
              MODEL_SHA256: 06507c7b42688469c4e7298b0a1e16deff06caf291cf0a5b278c308249c3e439
            resources: *downloadResources
            securityContext: *securityContext
        containers:
          app:
            image:
              repository: ghcr.io/ggml-org/llama.cpp
              tag: server-cuda-b12464@sha256:ae96e52f8b2106ea82bad786ee2d08bb9b0a8c93403df9c27ae1bf065a118089
            args: [--model, /models/Qwen3-Embedding-0.6B-Q8_0.gguf, --alias, qwen3-embedding, --host, 0.0.0.0, --port, "8080", --n-gpu-layers, "99", --ctx-size, "2048", --parallel, "1", --batch-size, "512", --ubatch-size, "512", --embeddings, --pooling, last, --cont-batching, --threads, "2", --threads-batch, "4", --metrics]
            env:
              NVIDIA_DRIVER_CAPABILITIES: compute,utility
            probes: *probes
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
                nvidia.com/gpu.shared: 1
              limits:
                memory: 2Gi
                nvidia.com/gpu.shared: 1
            securityContext: *securityContext

    service:
      qwen3-1-7b-q8: &service
        controller: qwen3-1-7b-q8
        ports:
          http:
            port: 8080
      translategemma-4b-q4:
        <<: *service
        controller: translategemma-4b-q4
      qwen3-5-0-8b-q4:
        <<: *service
        controller: qwen3-5-0-8b-q4
      granite-4-h-1b-q4:
        <<: *service
        controller: granite-4-h-1b-q4
      gemma4-e2b-q4:
        <<: *service
        controller: gemma4-e2b-q4
      qwen3-embedding-0-6b:
        <<: *service
        controller: qwen3-embedding-0-6b

    persistence:
      qwen3-1-7b-q8: &cache
        type: persistentVolumeClaim
        storageClass: openebs-hostpath
        accessMode: ReadWriteOnce
        size: 5Gi
        advancedMounts:
          qwen3-1-7b-q8: &cacheMounts
            download:
              - path: /models
            app:
              - path: /models
                readOnly: true
      translategemma-4b-q4:
        <<: *cache
        advancedMounts:
          translategemma-4b-q4: *cacheMounts
      qwen3-5-0-8b-q4:
        <<: *cache
        advancedMounts:
          qwen3-5-0-8b-q4: *cacheMounts
      granite-4-h-1b-q4:
        <<: *cache
        advancedMounts:
          granite-4-h-1b-q4: *cacheMounts
      gemma4-e2b-q4:
        <<: *cache
        advancedMounts:
          gemma4-e2b-q4: *cacheMounts
      qwen3-embedding-0-6b:
        <<: *cache
        advancedMounts:
          qwen3-embedding-0-6b: *cacheMounts
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
