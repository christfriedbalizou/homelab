---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: llama-cpp
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    disableWait: true
    remediation:
      retries: 3
  upgrade:
    disableWait: true
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault

    controllers:
      qwen3-1-7b-q8:
        strategy: Recreate
        pod: &cpuPod
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: In
                        values:
                          - k8s-6
                          - k8s-7
        initContainers:
          download:
            image: &curl
              repository: docker.io/curlimages/curl
              tag: 8.23.0@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
            command: &download
              - /bin/sh
              - -c
              - |
                set -eu
                dest="/models/$MODEL_FILE"
                part="$dest.part"
                verified() { echo "$MODEL_SHA256  $1" | sha256sum -c -s -; }
                [ -f "$dest" ] && exit 0
                if [ -f "$part" ] && verified "$part"; then mv "$part" "$dest"; exit 0; fi
                curl -fL --retry 5 --retry-all-errors --retry-delay 10 -C - --no-progress-meter -o "$part" "$MODEL_URL"
                if ! verified "$part"; then rm -f "$part"; echo "checksum mismatch for $MODEL_FILE" >&2; exit 1; fi
                mv "$part" "$dest"
            env:
              MODEL_FILE: Qwen3-1.7B-Q8_0.gguf
              MODEL_URL: https://huggingface.co/Qwen/Qwen3-1.7B-GGUF/resolve/90862c4b9d2787eaed51d12237eafdfe7c5f6077/Qwen3-1.7B-Q8_0.gguf
              MODEL_SHA256: 061b54daade076b5d3362dac252678d17da8c68f07560be70818cace6590cb1a
            resources: &downloadResources
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 256Mi
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
        containers:
          app:
            image: &image
              repository: ghcr.io/ggml-org/llama.cpp
              tag: server-b12602@sha256:ae28f5c2046de51dfd00c9116a36fe44b5e8703ef730d0aea69082781eecb1f7
            args: [--model, /models/Qwen3-1.7B-Q8_0.gguf, --alias, qwen3-1.7b-q8-local, --host, 0.0.0.0, --port, "8080", --load-mode, none, --ctx-size, "4096", --parallel, "1", --batch-size, "512", --ubatch-size, "512", --jinja, --cont-batching, --cache-ram, "256", --threads, "4", --threads-batch, "8", --metrics]
            probes: &probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8080
                  periodSeconds: 10
                  failureThreshold: 60
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8080
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 6
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8080
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 6
            resources:
              requests:
                cpu: "2"
                memory: 3Gi
              limits:
                memory: 5Gi
            securityContext: *securityContext

      translategemma-4b-q4:
        strategy: Recreate
        pod: *cpuPod
        initContainers:
          download:
            image: *curl
            command: *download
            env:
              MODEL_FILE: translategemma-4b-it.Q4_K_M.gguf
              MODEL_URL: https://huggingface.co/mradermacher/translategemma-4b-it-GGUF/resolve/d37868f759d2f817a43d28dd80cf9f982ffa62fd/translategemma-4b-it.Q4_K_M.gguf
              MODEL_SHA256: 81200d03e843d2ec1ece6eeafe7d13cb6e5211e1fcd336ade55790b683a08330
            resources: *downloadResources
            securityContext: *securityContext
        containers:
          app:
            image: *image
            args: [--model, /models/translategemma-4b-it.Q4_K_M.gguf, --alias, translategemma-4b-q4-local, --host, 0.0.0.0, --port, "8080", --load-mode, none, --ctx-size, "4096", --parallel, "1", --batch-size, "512", --ubatch-size, "512", --jinja, --cont-batching, --cache-ram, "256", --threads, "4", --threads-batch, "8", --metrics]
            probes: *probes
            resources:
              requests:
                cpu: "2"
                memory: 4Gi
              limits:
                memory: 6Gi
            securityContext: *securityContext

      qwen3-5-0-8b-q4:
        strategy: Recreate
        pod: *cpuPod
        initContainers:
          download:
            image: *curl
            command: *download
            env:
              MODEL_FILE: Qwen3.5-0.8B-Q4_K_M.gguf
              MODEL_URL: https://huggingface.co/unsloth/Qwen3.5-0.8B-GGUF/resolve/6ab461498e2023f6e3c1baea90a8f0fe38ab64d0/Qwen3.5-0.8B-Q4_K_M.gguf
              MODEL_SHA256: bd258782e35f7f458f8aced1adc053e6e92e89bc735ba3be89d38a06121dc517
            resources: *downloadResources
            securityContext: *securityContext
        containers:
          app:
            image: *image
            args: [--model, /models/Qwen3.5-0.8B-Q4_K_M.gguf, --alias, qwen3.5-0.8b-q4-local, --host, 0.0.0.0, --port, "8080", --load-mode, none, --ctx-size, "65536", --parallel, "1", --batch-size, "2048", --ubatch-size, "512", --cache-reuse, "256", --cache-ram, "1024", --ctx-checkpoints, "8", --jinja, --cont-batching, --threads, "8", --threads-batch, "16", --metrics]
            probes: *probes
            resources:
              requests:
                cpu: "2"
                memory: 3Gi
              limits:
                memory: 4Gi
            securityContext: *securityContext

      granite-4-h-tiny-q4:
        strategy: Recreate
        pod: *cpuPod
        initContainers:
          download:
            image: *curl
            command: *download
            env:
              MODEL_FILE: granite-4.0-h-tiny-Q4_K_M.gguf
              MODEL_URL: https://huggingface.co/ibm-granite/granite-4.0-h-tiny-GGUF/resolve/240a43d5efe7bdcfa4205b0019bb95e4cc6e5315/granite-4.0-h-tiny-Q4_K_M.gguf
              MODEL_SHA256: 5a38b08c441ae1adbafb1d2b8a7167e0d48734d83af68b268cefea1eec553dcd
            resources: *downloadResources
            securityContext: *securityContext
        containers:
          app:
            image: *image
            args: [--model, /models/granite-4.0-h-tiny-Q4_K_M.gguf, --alias, granite-4.0-h-tiny-q4-local, --host, 0.0.0.0, --port, "8080", --load-mode, none, --ctx-size, "65536", --parallel, "1", --batch-size, "2048", --ubatch-size, "512", --cache-reuse, "256", --cache-ram, "2048", --ctx-checkpoints, "8", --jinja, --cont-batching, --threads, "8", --threads-batch, "16", --metrics]
            probes: *probes
            resources:
              requests:
                cpu: "2"
                memory: 6Gi
              limits:
                memory: 8Gi
            securityContext: *securityContext

      gemma4-e2b-q4:
        strategy: Recreate
        pod: *cpuPod
        initContainers:
          download:
            image: *curl
            command: *download
            env:
              MODEL_FILE: gemma-4-E2B-it-Q4_K_M.gguf
              MODEL_URL: https://huggingface.co/unsloth/gemma-4-E2B-it-GGUF/resolve/0314792d7f1f7e229411f620751375812bb9faf2/gemma-4-E2B-it-Q4_K_M.gguf
              MODEL_SHA256: 740185b21d22ceb83a11c3aa62ad5842ef32c70f6096d756bbee85a1e4ec34b8
            resources: *downloadResources
            securityContext: *securityContext
        containers:
          app:
            image: *image
            args: [--model, /models/gemma-4-E2B-it-Q4_K_M.gguf, --alias, gemma4-e2b-q4-local, --host, 0.0.0.0, --port, "8080", --load-mode, none, --ctx-size, "65536", --parallel, "1", --batch-size, "2048", --ubatch-size, "512", --cache-reuse, "256", --cache-ram, "1024", --ctx-checkpoints, "8", --jinja, --cont-batching, --threads, "8", --threads-batch, "16", --metrics]
            probes: *probes
            resources:
              requests:
                cpu: "2"
                memory: 4Gi
              limits:
                memory: 6Gi
            securityContext: *securityContext

    service:
      qwen3-1-7b-q8: &service
        controller: qwen3-1-7b-q8
        ports:
          http:
            port: 8080
      translategemma-4b-q4:
        <<: *service
        controller: translategemma-4b-q4
      qwen3-5-0-8b-q4:
        <<: *service
        controller: qwen3-5-0-8b-q4
      granite-4-h-tiny-q4:
        <<: *service
        controller: granite-4-h-tiny-q4
      gemma4-e2b-q4:
        <<: *service
        controller: gemma4-e2b-q4

    persistence:
      qwen3-1-7b-q8: &cache
        type: persistentVolumeClaim
        storageClass: openebs-hostpath
        accessMode: ReadWriteOnce
        size: 5Gi
        advancedMounts:
          qwen3-1-7b-q8: &cacheMounts
            download:
              - path: /models
            app:
              - path: /models
                readOnly: true
      translategemma-4b-q4:
        <<: *cache
        advancedMounts:
          translategemma-4b-q4: *cacheMounts
      qwen3-5-0-8b-q4:
        <<: *cache
        advancedMounts:
          qwen3-5-0-8b-q4: *cacheMounts
      granite-4-h-tiny-q4:
        <<: *cache
        advancedMounts:
          granite-4-h-tiny-q4: *cacheMounts
      gemma4-e2b-q4:
        <<: *cache
        advancedMounts:
          gemma4-e2b-q4: *cacheMounts
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
