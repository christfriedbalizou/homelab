---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: memini
  namespace: flux-system
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: memini
  path: ./kubernetes/apps/ai/memini/app
  targetNamespace: ai
  prune: true
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
    namespace: flux-system
  dependsOn:
    - name: litellm
      namespace: ai
    - name: llmkube-models
      namespace: ai
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: memini
      namespace: ai
