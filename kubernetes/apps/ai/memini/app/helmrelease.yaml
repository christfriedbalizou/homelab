---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: memini
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: memini
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
    controllers:
      main:
        type: deployment
        replicas: 1
        annotations:
          reloader.stakater.com/auto: 'true'
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          automountServiceAccountToken: false
        containers:
          main:
            env:
              TZ: ${TIMEZONE}
              MEMINI_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: cluster-memini-secrets
                    key: MEMINI_API_KEY
              MEMINI_BACKEND: sqlite
              MEMINI_DEFAULT_NAMESPACE: default
              MEMINI_DEDUP_SIMILARITY: '0.80'
              MEMINI_SHORT_TERM_CAP: '300'
              MEMINI_DEMOTE_AFTER: 1440h
              MEMINI_TOMBSTONE_TTL: 720h
              MEMINI_LOG_FORMAT: json
              MEMINI_EMBED_BASE_URL: http://qwen3-embedding-0-6b.ai.svc.cluster.local:8080/v1
              MEMINI_EMBED_MODEL: qwen3-embedding
              MEMINI_EMBED_DIMS: '1024'
              MEMINI_EMBED_MAX_CONCURRENCY: '1'
              MEMINI_EMBED_QUERY_PREFIX: "Instruct: Given a user message, retrieve relevant past memories\nQuery: "
              MEMINI_RECALL_EMBED_TIMEOUT: 10s
              MEMINI_LLM_API: openai
              MEMINI_LLM_BASE_URL: http://litellm.ai.svc.cluster.local:4000/v1
              MEMINI_LLM_MODEL: qwen3-local
              MEMINI_LLM_MAX_TOKENS: '2048'
              MEMINI_DISTILL_TIMEOUT: 120s
              MEMINI_LLM_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: cluster-memini-secrets
                    key: LITELLM_API_KEY
              MEMINI_EMBED_MAX_BATCH: '4'
              MEMINI_EMBED_MAX_ITEM_CHARS: '1200'
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            image:
              repository: registry.erwanleboucher.dev/eleboucher/memini
              tag: 0.7.32
              digest: sha256:1e060967d6fd11dfb79eeaa67d8745e0dde5d946ca1b7dd7469b4fad2fac0c1d
          backup:
            image:
              repository: docker.io/library/python
              tag: 3.14.8-alpine@sha256:8acac70227ce3b34da9453120c375cc5b66cd0b062d4dc6bc74286f81a3819e1
            command:
              - python
              - -u
              - /scripts/backup.py
            env:
              PYTHONDONTWRITEBYTECODE: '1'
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
        strategy: Recreate
      fsck:
        enabled: true
        cronjob:
          schedule: 0 5 * * *
          timeZone: ${TIMEZONE}
        containers:
          fsck:
            env:
              MEMINI_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: cluster-memini-secrets
                    key: MEMINI_API_KEY
            image:
              repository: docker.io/curlimages/curl
              tag: 8.22.0@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777
    persistence:
      data:
        existingClaim: memini
        globalMounts: []
        advancedMounts:
          main:
            main:
              - path: /data
            backup:
              - path: /data
                readOnly: true
      backups:
        type: nfs
        server: ${NFS_SERVER_APPS}
        path: /volume1/apps/ai/memini-backups
        advancedMounts:
          main:
            backup:
              - path: /backups
      scripts:
        type: configMap
        name: memini-backup
        advancedMounts:
          main:
            backup:
              - path: /scripts
                readOnly: true
    route:
      ui:
        enabled: true
        parentRefs:
          - name: envoy-external
            namespace: networking
        hostnames:
          - memini.${SECRET_DOMAIN}
      main:
        enabled: true
        hostnames:
          - memini-api.${SECRET_DOMAIN}
        parentRefs:
          - name: envoy-external
            namespace: networking
    serviceMonitor:
      main:
        enabled: true
