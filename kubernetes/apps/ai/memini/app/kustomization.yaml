---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ai
resources:
  - ./secret.sops.yaml
  - ./helmrelease.yaml
  - ./securitypolicy.yaml
  - ./pvc.yaml
configMapGenerator:
  - name: memini-backup
    files:
      - backup.py=resources/backup.py
generatorOptions:
  disableNameSuffixHash: true
