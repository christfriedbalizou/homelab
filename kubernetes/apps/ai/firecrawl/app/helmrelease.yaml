---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: firecrawl
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault

    controllers:
      firecrawl:
        annotations:
          reloader.stakater.com/auto: "true"
        strategy: Recreate
        initContainers:
          wait-postgres:
            image: &postgres
              repository: ghcr.io/firecrawl/nuq-postgres
              tag: latest@sha256:d719b36160eac2fcbe16dc7e7360ddb9c82c40ea5da183d07bf4a755c6a0b2ae
            command:
              - sh
              - -c
              - until pg_isready -q -h firecrawl-postgres.ai.svc.cluster.local -p 5432 -U postgres -d postgres; do sleep 2; done
            resources:
              requests:
                cpu: 5m
                memory: 16Mi
              limits:
                memory: 32Mi
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
        containers:
          api:
            image: &image
              repository: ghcr.io/firecrawl/firecrawl
              tag: latest@sha256:e12baea631bc48c30566403166192735c2e31b0232aed81274c9a6dea67d1d19
            command:
              - node
              - /app/dist/src/main.js
              - api
            env: &env
              ENV: local
              HOME: /tmp
              HOST: 0.0.0.0
              PORT: "3002"
              USE_DB_AUTHENTICATION: "false"
              REDIS_URL: &redis redis://dragonfly.storage.svc.cluster.local:6379/9
              REDIS_RATE_LIMIT_URL: *redis
              PLAYWRIGHT_MICROSERVICE_URL: http://firecrawl-playwright.ai.svc.cluster.local:3000/scrape
              SEARXNG_ENDPOINT: http://searxng.default.svc.cluster.local:8080
              NUM_WORKERS_PER_QUEUE: "1"
              CRAWL_CONCURRENT_REQUESTS: "2"
              MAX_CONCURRENT_JOBS: "2"
              BROWSER_POOL_SIZE: "1"
              LOGGING_LEVEL: warn
              NUQ_POD_NAME: api
            envFrom: &envFrom
              - secretRef:
                  name: firecrawl-secrets
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/liveness
                    port: 3002
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/readiness
                    port: 3002
                  periodSeconds: 15
                  timeoutSeconds: 5
                  failureThreshold: 3
            resources:
              requests:
                cpu: 25m
                memory: 320Mi
              limits:
                memory: 768Mi
            securityContext: *securityContext
          worker:
            image: *image
            command:
              - node
              - /app/dist/src/main.js
              - nuq-worker
            env:
              <<: *env
              NUQ_POD_NAME: nuq-worker-0
              NUQ_WORKER_PORT: "3006"
            envFrom: *envFrom
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 3006
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
            resources:
              requests:
                cpu: 25m
                memory: 320Mi
              limits:
                memory: 768Mi
            securityContext: *securityContext

      postgres:
        annotations:
          reloader.stakater.com/auto: "true"
        strategy: Recreate
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
        containers:
          app:
            image: *postgres
            args:
              - postgres
              - -c
              - shared_buffers=16MB
              - -c
              - wal_buffers=1MB
              - -c
              - max_wal_size=256MB
              - -c
              - min_wal_size=64MB
              - -c
              - max_connections=40
              - -c
              - effective_io_concurrency=16
              - -c
              - maintenance_io_concurrency=16
              - -c
              - cron.log_run=off
              - -c
              - cron.log_statement=off
            env:
              PGDATA: /var/lib/postgresql/data/pgdata
            envFrom:
              - secretRef:
                  name: firecrawl-postgres
            probes:
              liveness: &pgready
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - pg_isready
                      - -q
                      - -h
                      - 127.0.0.1
                      - -U
                      - postgres
                  periodSeconds: 15
                  timeoutSeconds: 5
                  failureThreshold: 4
              readiness: *pgready
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
            securityContext: *securityContext

      playwright:
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/firecrawl/playwright-service
              tag: latest@sha256:227ce3d8059173925a5a0697c63a1e947662cca934a609151651f578774edd5d
            command:
              - node
              - /usr/src/app/dist/api.js
            env:
              HOME: /tmp
              PORT: "3000"
              MAX_CONCURRENT_PAGES: "2"
              BLOCK_MEDIA: "true"
            probes:
              liveness: &tcp
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 3000
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *tcp
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
            securityContext: *securityContext

    service:
      app:
        controller: firecrawl
        ports:
          http:
            port: 3002
      playwright:
        controller: playwright
        ports:
          http:
            port: 3000
      postgres:
        controller: postgres
        ports:
          postgres:
            port: 5432

    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            url: "https://firecrawl.${SECRET_DOMAIN}/health/liveness"
            conditions:
              - "[STATUS] == 401"
        hostnames:
          - firecrawl.${SECRET_DOMAIN}
        parentRefs:
          - name: envoy-external
            namespace: networking
        rules:
          - backendRefs:
              - identifier: app
                port: 3002
            timeouts:
              request: 300s

    persistence:
      data:
        type: emptyDir
        sizeLimit: 2Gi
        advancedMounts:
          postgres:
            app:
              - path: /var/lib/postgresql/data
      run:
        type: emptyDir
        advancedMounts:
          postgres:
            app:
              - path: /var/run/postgresql
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
