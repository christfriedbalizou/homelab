---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: firecrawl
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault

    controllers:
      firecrawl:
        annotations:
          reloader.stakater.com/auto: "true"
        strategy: Recreate
        initContainers:
          schema:
            image: &psql
              repository: ghcr.io/cloudnative-pg/postgresql
              tag: 18.6@sha256:899d3ed526b659d77935dde0e6bf2d69dbbf17d3d8c6486ca8cfd04bd3c18533
            command:
              - psql
              - -X
              - -q
              - -v
              - ON_ERROR_STOP=1
              - -d
              - $(NUQ_DATABASE_URL)
              - -f
              - /sql/nuq-schema.sql
            env: &psqlEnv
              HOME: /tmp
              PGOPTIONS: -c client_min_messages=warning
            envFrom: &envFrom
              - secretRef:
                  name: firecrawl-secrets
            resources:
              requests:
                cpu: 5m
                memory: 16Mi
              limits:
                memory: 64Mi
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
        containers:
          api:
            image: &image
              repository: ghcr.io/firecrawl/firecrawl
              tag: latest@sha256:362ea5bf7bf21b43711e1c675af621e10bd102eee26ee4bf1fc5c0f9f25a97ae
            command:
              - node
              - /app/dist/src/main.js
              - api
            env: &env
              ENV: local
              HOME: /tmp
              HOST: 0.0.0.0
              PORT: "3002"
              USE_DB_AUTHENTICATION: "false"
              REDIS_URL: &redis redis://dragonfly.storage.svc.cluster.local:6379/9
              REDIS_RATE_LIMIT_URL: *redis
              PLAYWRIGHT_MICROSERVICE_URL: http://firecrawl-playwright.ai.svc.cluster.local:3000/scrape
              SEARXNG_ENDPOINT: http://searxng.default.svc.cluster.local:8080
              NUM_WORKERS_PER_QUEUE: "1"
              CRAWL_CONCURRENT_REQUESTS: "2"
              MAX_CONCURRENT_JOBS: "2"
              BROWSER_POOL_SIZE: "1"
              LOGGING_LEVEL: warn
              NUQ_POD_NAME: api
            envFrom: *envFrom
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/liveness
                    port: 3002
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/readiness
                    port: 3002
                  periodSeconds: 15
                  timeoutSeconds: 5
                  failureThreshold: 3
            resources:
              requests:
                cpu: 25m
                memory: 320Mi
              limits:
                memory: 768Mi
            securityContext: *securityContext
          worker:
            image: *image
            command:
              - node
              - /app/dist/src/main.js
              - nuq-worker
            env:
              <<: *env
              NUQ_POD_NAME: nuq-worker-0
              NUQ_WORKER_PORT: "3006"
            envFrom: *envFrom
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 3006
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
            resources:
              requests:
                cpu: 25m
                memory: 320Mi
              limits:
                memory: 768Mi
            securityContext: *securityContext
          maintenance:
            image: *psql
            command:
              - sh
              - -c
              - while true; do psql -X -q -o /dev/null -d "$NUQ_DATABASE_URL" -f /sql/nuq-maintenance.sql; sleep 15; done
            env: *psqlEnv
            envFrom: *envFrom
            resources:
              requests:
                cpu: 5m
                memory: 16Mi
              limits:
                memory: 64Mi
            securityContext: *securityContext

      playwright:
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/firecrawl/playwright-service
              tag: latest@sha256:227ce3d8059173925a5a0697c63a1e947662cca934a609151651f578774edd5d
            command:
              - node
              - /usr/src/app/dist/api.js
            env:
              HOME: /tmp
              PORT: "3000"
              MAX_CONCURRENT_PAGES: "2"
              BLOCK_MEDIA: "true"
            probes:
              liveness: &tcp
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 3000
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *tcp
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
            securityContext: *securityContext

    service:
      app:
        controller: firecrawl
        ports:
          http:
            port: 3002
      playwright:
        controller: playwright
        ports:
          http:
            port: 3000

    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            url: "https://firecrawl.${SECRET_DOMAIN}/health/liveness"
            conditions:
              - "[STATUS] == 401"
        hostnames:
          - firecrawl.${SECRET_DOMAIN}
        parentRefs:
          - name: envoy-external
            namespace: networking
        rules:
          - backendRefs:
              - identifier: app
                port: 3002
            timeouts:
              request: 300s

    persistence:
      sql:
        type: configMap
        name: firecrawl-sql
        advancedMounts:
          firecrawl:
            schema:
              - path: /sql
                readOnly: true
            maintenance:
              - path: /sql
                readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
