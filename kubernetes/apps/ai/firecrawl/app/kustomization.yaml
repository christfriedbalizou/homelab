---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ai
resources:
  - ./secret.sops.yaml
  - ./ciliumnetworkpolicy.yaml
  - ./securitypolicy.yaml
  - ./helmrelease.yaml
configMapGenerator:
  - name: firecrawl-sql
    files:
      - ./resources/nuq-schema.sql
      - ./resources/nuq-maintenance.sql
    options:
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
generatorOptions:
  disableNameSuffixHash: true
