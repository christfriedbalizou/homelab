---
model:
  default: qwen3.5-0.8b-q4-local
  provider: custom:litellm

providers:
  litellm:
    api: http://litellm.ai.svc.cluster.local:4000/v1
    discover_models: true
    key_env: LITELLM_API_KEY
    name: LiteLLM
    transport: chat_completions
    request_timeout_seconds: 3600
    stale_timeout_seconds: 3600

dashboard:
  oauth:
    provider: self-hosted
    self_hosted:
      client_id: hermes
      issuer: https://auth.${SECRET_DOMAIN}
      scopes: openid profile email
  public_url: https://hermes-dash.${SECRET_DOMAIN}
  trusted_proxies:
    - 10.42.0.0/16

security:
  redact_secrets: true

terminal:
  backend: local
  cwd: /opt/data/workspace
  env_passthrough:
    - SEARXNG_URL

webapp:
  enabled: true
  host: 0.0.0.0
  port: 9120
  public_url: https://hermes.${SECRET_DOMAIN}
