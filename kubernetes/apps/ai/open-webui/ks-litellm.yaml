---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# Replace the existing open-webui/ks.yaml entry with this file at activation.
# Do not register both: they manage the same Flux Kustomization and HelmRelease.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: open-webui
  namespace: flux-system
spec:
  components:
    - ../../../../components/persistence/jericho-nfs
  commonMetadata:
    labels:
      app.kubernetes.io/name: open-webui
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  path: ./kubernetes/apps/ai/open-webui/litellm
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
    substitute:
      APP: open-webui
      JERICHO_PATH: /volume1/apps/ai
  targetNamespace: ai
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
    namespace: flux-system
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: open-webui
      namespace: ai
  interval: 30m
  retryInterval: 1m
  timeout: 3m
  dependsOn:
    - name: litellm
      namespace: ai
    - name: llmkube-models
      namespace: ai
