---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: llmkube
  namespace: flux-system
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: llmkube
  path: ./kubernetes/apps/ai/llmkube/app
  targetNamespace: ai
  prune: true
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
    namespace: flux-system
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: llmkube
      namespace: ai
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: llmkube-models
  namespace: flux-system
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: llmkube-models
  path: ./kubernetes/apps/ai/llmkube/models
  targetNamespace: ai
  prune: true
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
    namespace: flux-system
  dependsOn:
    - name: llmkube
      namespace: flux-system
    - name: nvidia
      namespace: flux-system
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  healthCheckExprs:
    - apiVersion: inference.llmkube.dev/v1alpha1
      kind: InferenceService
      failed: has(status) && has(status.phase) && status.phase == 'Failed'
      current: has(status) && has(status.phase) && status.phase == 'Ready'
