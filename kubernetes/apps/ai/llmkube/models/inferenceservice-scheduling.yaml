---
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: inferenceservice-scheduling
spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                  - k8s-6
                  - k8s-7
