---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app ollama
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      ollama:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          enableServiceLinks: false
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: In
                        values: [k8s-6, k8s-7]
        containers:
          app:
            image:
              repository: docker.io/ollama/ollama
              tag: 0.40.2@sha256:b86366bb528bbf7f1424435d165028497a5b69bf6ddb4fa5a87102e2b79f44fb
            env:
              CUDA_VISIBLE_DEVICES: "-1"
              ROCR_VISIBLE_DEVICES: "-1"
              OLLAMA_VULKAN: "0"
              OLLAMA_HOST: 0.0.0.0:11434
              OLLAMA_KEEP_ALIVE: 60s
              OLLAMA_MAX_LOADED_MODELS: "1"
              OLLAMA_CONTEXT_LENGTH: "8192"
              OLLAMA_FLASH_ATTENTION: "true"
              OLLAMA_KV_CACHE_TYPE: q8_0
              OLLAMA_NUM_PARALLEL: "1"
              OLLAMA_MODELS: /models
              OLLAMA_NO_CLOUD: "true"
              TZ: "${TIMEZONE}"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 11434
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  initialDelaySeconds: 10
                  periodSeconds: 5
                  timeoutSeconds: 1
                  failureThreshold: 30
            resources:
              requests:
                cpu: 100m
                memory: 2Gi
              limits:
                memory: 32Gi

    service:
      app:
        controller: *app
        ports:
          http:
            port: *port

    persistence:
      config:
        existingClaim: ollama-jericho
        globalMounts:
          - subPath: ollama
            path: /root/.ollama
      models:
        existingClaim: ollama-lordcommander
        globalMounts:
          - subPath: ollama
            path: /models
