---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/batch/job_v1.json
apiVersion: batch/v1
kind: Job
metadata:
  name: ollama-pull-local-models-v2
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 3600
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pull
          # The CLI asks the existing Ollama server to download into its model volume.
          # This Job neither starts another server nor requests a GPU.
          image: docker.io/ollama/ollama:0.35.0@sha256:2a6e883b917fc543389599dae79918f5cac9e1438890506982f44aa4f5625d01
          command:
            - /bin/sh
            - -ec
            - |
              # A healthy Helm release can still have a temporarily unavailable
              # server during GPU rescheduling. Wait within the Job deadline.
              until ollama list >/dev/null 2>&1; do
                sleep 5
              done
              for model in qwen3:4b-q4_K_M qwen3:1.7b-q4_K_M qwen2.5-coder:3b-instruct-q4_K_M; do
                ollama pull "$model"
                ollama show "$model" >/dev/null
              done
          env:
            - name: OLLAMA_HOST
              value: http://ollama.ai.svc.cluster.local:11434
            - name: HOME
              value: /tmp
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
