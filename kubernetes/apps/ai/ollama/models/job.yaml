---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/batch/job_v1.json
apiVersion: batch/v1
kind: Job
metadata:
  # Job specs are immutable. Bump the name whenever the model set changes so
  # Flux creates a new pull instead of attempting to patch the completed Job.
  name: ollama-pull-local-models-v5
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 3600
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pull
          # The CLI asks the existing Ollama server to download into its model volume.
          # This Job neither starts another server nor requests a GPU.
          image: docker.io/ollama/ollama:0.40.2@sha256:b86366bb528bbf7f1424435d165028497a5b69bf6ddb4fa5a87102e2b79f44fb
          command:
            - /bin/sh
            - -ec
            - |
              # A healthy Helm release can still have a temporarily unavailable
              # server during rescheduling. Wait within the Job deadline.
              until ollama list >/dev/null 2>&1; do
                sleep 5
              done
              for model in qwen3:8b-q4_K_M qwen3:14b-q4_K_M qwen3:32b-q4_K_M qwen3:4b-q4_K_M qwen3:1.7b-q4_K_M translategemma:4b-it-q4_K_M; do
                ollama pull "$model"
                ollama show "$model" >/dev/null
              done
          env:
            - name: OLLAMA_HOST
              value: http://ollama.ai.svc.cluster.local:11434
            - name: HOME
              value: /tmp
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
