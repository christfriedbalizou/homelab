---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app tv-guides
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      tv-guides:
        replicas: 1
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          automountServiceAccountToken: false
          terminationGracePeriodSeconds: 90
          nodeSelector:
            kubernetes.io/arch: amd64
          securityContext:
            runAsNonRoot: true
            runAsUser: 568
            runAsGroup: 568
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: { type: RuntimeDefault }
        containers:
          app:
            image:
              repository: ghcr.io/christfriedbalizou/tv-guides
              tag: 0.5.0@sha256:aa00b46a857b2a3f3bfdaa39efadc0e50103480ef1a40444143cfacc6d75c1f3
            args: [run]
            env:
              TZ: ${TIMEZONE}
              TV_GUIDES_WORK_DIR: /data
              TV_GUIDES_PLAYLIST_URL_FILE: /run/secrets/tv-guides/playlist-url
              TV_GUIDES_INTERVAL_SECONDS: "21600"
              TV_GUIDES_LOG_LEVEL: INFO
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            probes:
              liveness: &probes
                enabled: false
              readiness: *probes
              startup: *probes
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                cpu: "1"
                memory: 1Gi
    persistence:
      data:
        existingClaim: tv-guides-jericho
        globalMounts:
          - path: /data
      secrets:
        type: secret
        name: *app
        defaultMode: 0440
        advancedMounts:
          tv-guides:
            app:
              - path: /run/secrets/tv-guides
                readOnly: true
      tmp:
        type: emptyDir
        advancedMounts:
          tv-guides:
            app:
              - path: /tmp
