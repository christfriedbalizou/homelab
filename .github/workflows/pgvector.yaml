---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Pgvector compatibility

on:
  pull_request:
    branches:
      - main
    paths:
      - kubernetes/apps/storage/cloudnative-pg/cluster/**
      - kubernetes/apps/storage/cloudnative-pg/databases/immich.yaml
      - kubernetes/apps/default/immich/app/helmrelease.yaml
      - .github/scripts/sync-pgvector*.mjs
      - .github/workflows/pgvector.yaml
      - .github/workflows/renovate.yaml
      - .renovaterc.json5
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pgvector-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Pgvector compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test version extraction and compatibility checks
        run: node --test .github/scripts/sync-pgvector.test.mjs
      - name: Verify image contents, database pin, and Immich compatibility
        run: node .github/scripts/sync-pgvector.mjs --check
